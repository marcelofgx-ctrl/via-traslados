name: Via Traslados - auditoria de secretos (solo nombres)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/via-api-secrets-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar únicamente nombres de secretos del backend Vía
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx --yes wrangler@4 secret list --name via-traslados-api --format json > /tmp/via-secret-names.json
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/via-secret-names.json','utf8'));const names=new Set(s.map(x=>x.name));const checks=['OTP_PEPPER','RESEND_API_KEY','TURNSTILE_SECRET_KEY','OPERATOR_KEY_HASH'];require('fs').mkdirSync('.ci',{recursive:true});require('fs').writeFileSync('.ci/via-api-secrets-audit.txt',checks.map(x=>x+': '+(names.has(x)?'CONFIGURADO':'FALTA')).join('\\n')+'\\n');"
      - name: Guardar comprobación sin mostrar los valores secretos
        if: always()
        run: |
          test -f .ci/via-api-secrets-audit.txt || { mkdir -p .ci; echo "No fue posible consultar los nombres de secretos" > .ci/via-api-secrets-audit.txt; }
          git config user.name "via-traslados-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/via-api-secrets-audit.txt
          git commit -m "ci(via-api): auditoría de presencia de secretos" || true
          git push origin HEAD:main || true
