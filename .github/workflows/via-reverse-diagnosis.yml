name: Vía — real reverse geocoder diagnosis, no deployment
on:
  push:
    branches: [via-v30410-visual-compat-qa-20261125]
    paths: ['.github/workflows/via-reverse-diagnosis.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect actual active reverse routing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-reverse-source-diagnosis.py
      - name: Compare public production, candidate and API responses
        if: always()
        run: node scripts/via-reverse-diagnosis.mjs
