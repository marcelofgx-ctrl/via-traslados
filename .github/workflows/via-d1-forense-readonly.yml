name: Vía Maestra — D1 forense estrictamente solo lectura
on:
  push:
    branches: [via-maestro-d1-forense-readonly-20261118]
    paths:
      - "scripts/via-d1-forense-readonly.mjs"
      - ".github/workflows/via-d1-forense-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Leer únicamente metadatos y contadores agregados sin restaurar D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/via-d1-forense-readonly.mjs
