name: Vía V30.4.10.19 — GPS premium isolated QA
on:
  push:
    branches: [via-gps-premium-v3041011-qa-20261126]
    paths: ['.github/workflows/via-gps-premium-qa.yml']
permissions:
  contents: read
concurrency:
  group: via-gps-premium-qa-density
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify previous QA and build presentation only
        run: |
          node --check addons/via-gps-premium.js
          node tests/via-reverse-cache.test.mjs
          python3 scripts/via-gps-premium-build.py
      - name: Deploy separate QA, preserve .18 rollback
        run: npx --yes wrangler@4.160.1 deploy --config v30410-visual/geo-integral/wrangler-premium.jsonc
      - name: Verify live version and blocked reservations
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const u='https://via-traslados-search-density-qa.marcelof-gx.workers.dev';
          const get=async (p,opts={})=>fetch(u+p,{...opts,headers:{'User-Agent':'ViaTrasladosV35SignedRelease','Cache-Control':'no-cache',...(opts.headers||{})},signal:AbortSignal.timeout(12000)});
          let ready=false;
          for(let i=0;i<8;i++){try{const r=await get('/index.html');const h=await r.text();console.log('VIA_LIVE_CHECK',r.status,h.includes('V30.4.10.19 QA'));if(r.ok&&h.includes('V30.4.10.19 QA')){ready=true;break}}catch(e){console.log(e.name)}await new Promise(r=>setTimeout(r,2500));}
          assert(ready,'Exact new QA not yet reachable');
          const css=await get('/via-gps-premium.css');assert(css.ok);const style=await css.text();assert(style.includes('content:none!important'));assert(!style.includes('content:"Mi ubicación"'));
          // A newly deployed workers.dev hostname can be partially propagated.
          // Require actual QA health AND explicit reservation denial, not merely a 404.
          let protectedQa=false;
          for(let i=0;i<8;i++){
            const health=await get('/api/health'),me=await get('/api/customer/me'),post=await get('/api/requests',{method:'POST',body:'{}'});
            console.log('VIA_QA_GUARD',health.status,me.status,post.status);
            if(health.ok&&me.status===503&&post.status===503){
              const j=await health.json();assert.equal(j.reservations,false);protectedQa=true;break;
            }
            if(me.ok||post.ok)throw Error('Unexpected access to QA accounts or reservations');
            await new Promise(r=>setTimeout(r,2500));
          }
          assert(protectedQa,'QA health or explicit reservation denial not verified');
          const page=await get('/index.html');assert((await page.text()).includes('placeholder="¿Dónde te recogemos?"'));
          assert(style.includes('width:44px!important'));assert(style.includes('--via-suggest-width'));assert(style.includes('38px painted control'));assert(style.includes('One continuous journey card'));assert(style.includes('Refined place results'));assert(style.includes('min-height:44px!important;padding:5px 10px!important;gap:4px!important'));assert(style.includes('font-size:14px!important;font-weight:400!important;letter-spacing:-.1px!important'));assert((await (await get('/index.html')).text()).includes('id="via-geography-credit"'));
          console.log('VIA_GPS_PREMIUM_LIVE '+u);
          NODE
      - name: Verify production unchanged
        if: always()
        run: python3 -c "import runpy;m=runpy.run_path('scripts/v302-route-cache-qa.py');assert m['version'](m['WEB'])=='b23d68ea-5aae-4827-b808-3c4c3504a959' and m['version'](m['API'])=='5ad845a7-beeb-44e5-9e52-6459bd1fbb8b';print('VIA_PRODUCTION_UNCHANGED')"
      - uses: actions/upload-artifact@v4
        with:
          name: gps-premium-manifest
          path: v30410-visual/geo-integral/gps-premium-manifest.json
  browsers:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install matching Playwright package, engines already in image
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Cross-browser GPS, compact search and safe cancellation
        env:
          HOME: /root
        run: node scripts/via-gps-premium-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gps-premium-browser-evidence
          path: gps-premium-evidence
          if-no-files-found: ignore
