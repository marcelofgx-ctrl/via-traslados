name: Vía Maestra — QA integrada API + D1 aislada (NO PROD)
on:
  push:
    branches: [via-maestro-integracion-real-qa-20261118]
    paths:
      - "backend/**"
      - "scripts/maestro-qa-provision.mjs"
      - "scripts/maestro-qa-worker-bootstrap.mjs"
      - "scripts/maestro-passenger-driver-e2e.mjs"
      - ".github/workflows/via-maestro-integracion-api-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: via-maestro-qa-api-only
  cancel-in-progress: false
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verificar contratos completos antes de tocar QA
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run check
          python3 scripts/booking-submission-qa-sqlite.py
          python3 scripts/v29-dispatch-sql-test.py
          node --check backend/qa-entry-maestro.js
          node --check scripts/maestro-passenger-driver-e2e.mjs
      - name: Snapshot HTTP seguro de producción y QA previa
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://via-traslados-api.marcelof-gx.workers.dev/api/health' -o /tmp/via-prod-before.json
          curl -fLsS --retry 3 'https://via-traslados-api-qa.marcelof-gx.workers.dev/api/health' -o /tmp/via-v34-before.json
          node -e "let fs=require('fs');let p=JSON.parse(fs.readFileSync('/tmp/via-prod-before.json')),q=JSON.parse(fs.readFileSync('/tmp/via-v34-before.json'));if(!p.ok||!q.ok||q.qa!==true)process.exit(1)"
      - name: Crear o reconocer exclusivamente base nueva y configuración MAESTRO QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/maestro-qa-provision.mjs
          grep -Fx 'name = "via-traslados-maestro-api-qa"' wrangler.maestroqa.toml
          grep -Fx 'database_name = "via-traslados-maestro-qa-db"' wrangler.maestroqa.toml
          grep -Fx 'main = "backend/qa-entry-maestro.js"' wrangler.maestroqa.toml
          grep -Fx 'VIA_QA_MODE = "1"' wrangler.maestroqa.toml
          if grep -Fq 'database_name = "via-traslados-db"' wrangler.maestroqa.toml; then exit 1; fi
          if grep -Fq 'database_name = "via-traslados-v35-qa-db"' wrangler.maestroqa.toml; then exit 1; fi
          if grep -Fq 'name = "via-traslados-api"' wrangler.maestroqa.toml; then exit 1; fi
      - name: Crear tablas sintéticas sólo en base MAESTRO QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 d1 execute via-traslados-maestro-qa-db --remote --config wrangler.maestroqa.toml --file backend/schema.sql
          npx --yes wrangler@4.160.1 d1 execute via-traslados-maestro-qa-db --remote --config wrangler.maestroqa.toml --file backend/schema-qa-v33.sql
          node scripts/qa-seed.mjs
          npx --yes wrangler@4.160.1 d1 execute via-traslados-maestro-qa-db --remote --config wrangler.maestroqa.toml --file qa-seed.sql
          rm -f qa-seed.sql
      - name: Registrar Worker nuevo MAESTRO QA (jamás API productiva)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/maestro-qa-worker-bootstrap.mjs
      - name: Desplegar solo Worker MAESTRO QA sin compartir D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 deploy --config wrangler.maestroqa.toml
          ok=0
          for attempt in $(seq 1 14); do
            status=$(curl -sS -L --max-time 12 -o /tmp/via-maestro-health.json -w '%{http_code}' 'https://via-traslados-maestro-api-qa.marcelof-gx.workers.dev/api/health' || true)
            if [ "$status" = "200" ] && node -e "let x=require('/tmp/via-maestro-health.json');process.exit(x.ok&&x.qa&&x.production===false&&x.bookings>=5?0:1)"; then ok=1;break; fi
            sleep 3
          done
          test "$ok" -eq 1
      - name: E2E con HTTP REAL en QA — pasajeros, idempotencia, roles, tarifas, 25% y limpieza sintética
        run: node scripts/maestro-passenger-driver-e2e.mjs
      - name: Verificación de que producción y V34 QA siguen funcionando
        if: always()
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://via-traslados-api.marcelof-gx.workers.dev/api/health' -o /tmp/via-prod-after.json
          curl -fLsS --retry 3 'https://via-traslados-api-qa.marcelof-gx.workers.dev/api/health' -o /tmp/via-v34-after.json
          node -e "let fs=require('fs');let p=JSON.parse(fs.readFileSync('/tmp/via-prod-after.json')),q=JSON.parse(fs.readFileSync('/tmp/via-v34-after.json'));if(!p.ok||!q.ok||q.qa!==true)process.exit(1)"
          echo 'MAESTRO_QA_SEPARADA_PROD_Y_V34_VERIFICADAS'
