name: Vía Traslados — V29.1.5 UI móvil QA aislada
on:
  push:
    branches: [via-ui-v2915-qa-20261120]
    paths: ['.github/workflows/via-ui-v2915-qa.yml', 'scripts/via-ui-v2915-*']
permissions:
  contents: read
concurrency:
  group: via-ui-v2915-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Releer y congelar V29.1.4 productiva. No tocar API ni D1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/via-ui-v2915-prepare.py
          node --check scripts/via-ui-v2915-patch.mjs
          node --check scripts/via-ui-v2915-browser.mjs
          python3 scripts/via-ui-v2915-prepare.py
          node scripts/via-ui-v2915-patch.mjs
          node --check ui-v2915-build/assets/reference.js
          node --check ui-v2915-build/assets/address-autocomplete.js
          grep -Fq 'gpsWaitPolicy' ui-v2915-build/assets/reference.js
          grep -Fq 'visualViewport' ui-v2915-build/assets/address-autocomplete.js
          test "$(sha256sum ui-v2915-build/assets/geo-v2/core.mjs | cut -d' ' -f1)" = 17a9ef5d2396d595e6d0847b0b32da80244f75084ced89cad485ff22377509c1
          test "$(sha256sum ui-v2915-build/assets/store.js | cut -d' ' -f1)" = 3dc61982cbf5498402ae7eebdf01a03979d34fca9d81d5d77497d748e3b4e6c8
      - name: Aislar API QA y bloquear POST de reservas reales
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          file=Path('ui-v2915-build/assets/config.js')
          assert 'via-traslados-api.marcelof-gx.workers.dev' in file.read_text()
          file.write_text("window.VIA_CONFIG=Object.freeze({demo:false,apiUrl:'https://via-traslados-maestro-api-qa.marcelof-gx.workers.dev',turnstileSiteKey:''});\n")
          assert 'via-traslados-api.marcelof-gx.workers.dev' not in file.read_text()
          print('VIA_UI_V2915_QA_NO_PROD_API')
          PY
      - name: Desplegar SOLO Worker QA preexistente
        run: |
          set -euo pipefail
          cd ui-v2915-build
          npx --yes wrangler@4.160.1 deploy --config wrangler.qa.jsonc
      - name: Verificar HTTP 200 real, versión, hashes y 503 para reservas QA
        run: |
          set -euo pipefail
          URL=https://via-traslados-gps-precision-qa.marcelof-gx.workers.dev
          for i in $(seq 1 12); do
            code=$(curl -sSL --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/via-identity-qa -w '%{http_code}' "$URL/?identity_qa=2914" || true)
            if [ "$code" = 200 ] &&
              grep -Fq 'content="29.1.5"' /tmp/via-identity-qa &&
              grep -Fq 'reference.js?v=30' /tmp/via-identity-qa &&
              grep -Fq 'UI QA' /tmp/via-identity-qa; then break; fi
            sleep 3
          done
          test "$code" = 200
          grep -Fq 'content="29.1.5"' /tmp/via-identity-qa
          grep -Fq 'reference.js?v=30' /tmp/via-identity-qa
          curl -fsSL "$URL/address-autocomplete.js?v=27" | grep -F 'visualViewport' >/dev/null
          curl -fsSL "$URL/reference.js?v=30" | grep -F 'gpsWaitPolicy' >/dev/null
          curl -fsSL "$URL/config.js" | grep -F 'via-traslados-maestro-api-qa' >/dev/null
          test "$(curl -fsSL "$URL/geo-v2/core.mjs?v=3" | sha256sum | cut -d' ' -f1)" = 17a9ef5d2396d595e6d0847b0b32da80244f75084ced89cad485ff22377509c1
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/requests" -H 'content-type: application/json' --data '{}')" = 503
          curl -fsSL https://viatraslados.com/ | grep -F 'app.js?v=29.2' >/dev/null
          test "$(curl -fsSL 'https://viatraslados.com/app.js?v=29.2' | sha256sum | cut -d' ' -f1)" = 73afe2490a64b9a1c1b6cf4ce61283c1f68184208cbe783a70126cecc3b21e69
          echo VIA_UI_V2915_QA_PUBLIC_200_AND_PRODUCTION_UNCHANGED
      - name: Chrome móvil — teclado, direcciones, navegador, GPS y regresiones
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.58.2
          node scripts/via-ui-v2915-browser.mjs
          node scripts/via-gps-v2913-browser.mjs
          node scripts/via-identity-v2914-browser.mjs
      - name: Evidencias del release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-ui-v2915-qa-evidence
          path: |
            ui-v2915-build/manifest.json
            ui-v2915-build/assets/reference.js
            ui-v2915-build/assets/address-autocomplete.js
            ui-v2915-build/assets/index.html
          retention-days: 30
          if-no-files-found: warn
