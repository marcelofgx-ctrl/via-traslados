name: Via Traslados - restablecer cuentas de acceso una sola vez
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/via-reset-staff-once.yml"
permissions:
  contents: read
concurrency:
  group: via-staff-admin-reset
  cancel-in-progress: false
jobs:
  reset_staff:
    name: Eliminar cuentas de administrador y conductores, NO pasajeros
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirmar que esta es la base D1 exclusiva de Via Traslados
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-d1.mjs
          export VIA_D1_DATABASE_ID="$(sed -n 's/^VIA_D1_DATABASE_ID=//p' "$GITHUB_ENV" | tail -1)"
          test -n "$VIA_D1_DATABASE_ID"
          VIA_PUBLIC_ORIGIN=https://viatraslados.com VIA_RESEND_FROM='Vía Traslados <reservas@viatraslados.com>' node scripts/create-wrangler.mjs
          grep -Fx 'name = "via-traslados-api"' wrangler.toml
          grep -Fx 'database_name = "via-traslados-db"' wrangler.toml
          test -f backend/schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS staff_users' backend/schema.sql
      - name: Contabilizar personal y reservas antes del reset
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute via-traslados-db --remote --config wrangler.toml --command "SELECT (SELECT COUNT(*) FROM staff_users) AS staff_users, (SELECT COUNT(*) FROM staff_sessions) AS staff_sessions, (SELECT COUNT(*) FROM driver_assignments) AS driver_assignments, (SELECT COUNT(*) FROM bookings) AS bookings, (SELECT setting_value FROM service_settings WHERE setting_key='public_web_enabled') AS public_web_enabled;"
      - name: Reset solicitado por el propietario, exclusivamente tabla staff
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/via-reset-staff.sql <<'SQL'
          DELETE FROM driver_assignments;
          DELETE FROM staff_sessions;
          DELETE FROM staff_users;
          INSERT INTO admin_audit(actor_id,action,target,detail)
          VALUES('system','staff-reset','all-staff','Restablecimiento solicitado de cuentas de administradores y conductores');
          SQL
          npx --yes wrangler@4 d1 execute via-traslados-db --remote --config wrangler.toml --file /tmp/via-reset-staff.sql
      - name: Verificar cero usuarios, sesiones y asignaciones, sin tocar reservas
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute via-traslados-db --remote --config wrangler.toml --command "SELECT CASE WHEN (SELECT count(*) FROM staff_users)=0 AND (SELECT count(*) FROM staff_sessions)=0 AND (SELECT count(*) FROM driver_assignments)=0 THEN 'RESET_OK' ELSE 'RESET_FAILED' END AS result, (SELECT COUNT(*) FROM bookings) AS bookings_preserved, (SELECT setting_value FROM service_settings WHERE setting_key='public_web_enabled') AS web_enabled;" | tee /tmp/reset-result.txt
          grep -q 'RESET_OK' /tmp/reset-result.txt
          curl -fsSL --max-time 20 https://via-traslados-api.marcelof-gx.workers.dev/api/health | grep -q '"otpAvailable":true'
          curl -fsSL --max-time 20 https://viatraslados.com/ -o /tmp/via-index.html
          grep -q 'Vía Traslados' /tmp/via-index.html
          echo "RESTABLECIMIENTO DE CUENTAS COMPLETADO; RESERVAS Y WEB CONSERVADAS"
