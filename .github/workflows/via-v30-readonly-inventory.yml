name: Vía V30 — current API Worker and separate QA D1 inventory GET ONLY
on:
  push:
    branches: [via-v30-mvp-operativo-20261123]
    paths: [".github/workflows/via-v30-readonly-inventory.yml"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read API/web deployments and list D1 names and IDs — NO WRITES
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/v30-cloudflare-inventory.mjs
