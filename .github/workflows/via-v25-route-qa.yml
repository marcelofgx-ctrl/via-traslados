name: Vía Traslados - validación API kilometraje en Mis reservas
on:
  push:
    branches: [via-v25-booking-list-route-20261112]
    paths:
      - "backend/customer-auth.js"
      - "tests/customer-auth.test.mjs"
      - ".github/workflows/via-v25-route-qa.yml"
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Regresión completa de autenticación, reservas y kilómetros
        run: |
          npm test
          npm run check
      - name: Compilar Worker solo en seco
        run: |
          cat >wrangler-v25-route-dryrun.toml <<'EOF'
          name = "via-v25-route-dryrun"
          main = "backend/worker.js"
          compatibility_date = "2026-11-04"
          [[d1_databases]]
          binding = "DB"
          database_name = "via-traslados-db"
          database_id = "00000000-0000-4000-8000-000000000000"
          EOF
          npx --yes wrangler@4 deploy --dry-run --config wrangler-v25-route-dryrun.toml --outdir /tmp/via-v25-route
          echo API_V25_KILOMETROS_VALIDATED_NO_PROD_CHANGE
