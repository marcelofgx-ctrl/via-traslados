name: Vía Traslados V37 — production profile integration
on:
  push:
    branches: [via-v37-production-20261128]
    paths: ['.github/workflows/via-v354-production-apk.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: via-production-apk-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Queue regression and exact rollback baseline
        run: |
          mkdir -p /tmp/alert-tests
          javac -d /tmp/alert-tests android-driver/app/src/main/java/uy/viatraslados/conductor/RequestAlertQueue.java tests/RequestAlertQueueTest.java
          java -cp /tmp/alert-tests uy.viatraslados.conductor.RequestAlertQueueTest
          javac -d /tmp/alert-tests android-driver/app/src/main/java/uy/viatraslados/conductor/OverlayGesture.java tests/OverlayGestureTest.java
          java -cp /tmp/alert-tests uy.viatraslados.conductor.OverlayGestureTest
          javac -d /tmp/alert-tests android-driver/app/src/main/java/uy/viatraslados/conductor/LiveTripGuard.java tests/LiveTripGuardTest.java
          java -cp /tmp/alert-tests uy.viatraslados.conductor.LiveTripGuardTest
          git worktree add --detach /tmp/via-rollback 3c84538515a6302d9a9d06bca67a6f532f5ac8ce
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/via-rollback/android-driver/app/build.gradle')
          s=p.read_text();assert "versionCode viaProductionRelease ? 368" in s
          p.write_text(s.replace("versionCode viaProductionRelease ? 368","versionCode viaProductionRelease ? 3701").replace("versionName viaProductionRelease ? '0.35.12'","versionName viaProductionRelease ? '0.35.12-rollback'"))
          PY
      - name: Build production package and rollback package
        run: |
          gradle -p android-driver :app:assembleRelease -PviaProductionRelease=true --no-daemon
          gradle -p /tmp/via-rollback/android-driver :app:assembleRelease -PviaProductionRelease=true --no-daemon
      - uses: actions/download-artifact@v4
        with:
          name: VIA_V35_PROD_APK_SIGNED
          run-id: 44217589953
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-apk
      - uses: actions/download-artifact@v4
        with:
          name: VIA_V35_PROD_SIGNING_KEY_PRIVATE_BACKUP
          run-id: 44217589953
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-signing
      - name: Sign with original certificate, verify both binaries
        env:
          SIGN_DIR: ${{ runner.temp }}/original-signing
          ORIGINAL: ${{ runner.temp }}/original-apk/via-traslados-conductor-v35.apk
        run: |
          set -euo pipefail
          trap 'rm -rf "$SIGN_DIR"' EXIT
          chmod -R go-rwx "$SIGN_DIR"
          echo '324c1c5b8ed997ec12e51ba37afe665854d226d4a5dd995a4cc0a531651d65e3  '"$ORIGINAL" | sha256sum -c -
          echo 'PHASE: Android Build Tools 35.0.0 (original signing baseline)'
          tool="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$tool/apksigner" ] || [ ! -x "$tool/aapt" ] || [ ! -x "$tool/zipalign" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0'
          fi
          for bin in apksigner aapt zipalign; do
            test -x "$tool/$bin" || { echo "::error::Missing Android tool $bin"; exit 1; }
          done
          "$tool/apksigner" version
          cert() {
            local report digest
            if ! report="$("$tool/apksigner" verify --verbose --print-certs "$1" 2>&1)"; then
              printf '%s\n' "$report" >&2
              echo "::error::APK signature verification failed" >&2
              return 1
            fi
            digest="$(printf '%s\n' "$report" | awk '/^Signer #1 certificate SHA-256 digest:/ {print $NF}')"
            if [[ ! "$digest" =~ ^[[:xdigit:]]{64}$ ]]; then
              printf '%s\n' "$report" >&2
              echo "::error::Cannot extract original certificate SHA-256" >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }
          echo 'PHASE: Verify original APK certificate'
          expected="$(cert "$ORIGINAL")"
          echo "Original public certificate SHA-256: $expected"
          mkdir -p direct-apk/assets
          echo 'PHASE: Validate signing backup files'
          test -s "$SIGN_DIR/CLAVE-DE-FIRMA-GUARDAR.txt" || { echo '::error::Missing signing password file'; exit 1; }
          test -s "$SIGN_DIR/via-traslados-produccion-guardar.p12" || { echo '::error::Missing original keystore'; exit 1; }
          export SIGNPASS="$(cat "$SIGN_DIR/CLAVE-DE-FIRMA-GUARDAR.txt")"
          test -n "$SIGNPASS" || { echo '::error::Empty signing password'; exit 1; }
          echo "::add-mask::$SIGNPASS"
          for mode in pilot rollback; do
            if [ "$mode" = pilot ]; then
              src=android-driver/app/build/outputs/apk/release/app-release-unsigned.apk
              dest=direct-apk/assets/via-traslados-conductor-v37.apk
              code=3700
              version=0.37.0
              root=android-driver
            else
              src=/tmp/via-rollback/android-driver/app/build/outputs/apk/release/app-release-unsigned.apk
              dest=direct-apk/assets/via-traslados-conductor-v3512-rollback.apk
              code=3701
              version=0.35.12-rollback
              root=/tmp/via-rollback/android-driver
            fi
            echo "PHASE: $mode generated production build flags"
            cfg="$root/app/build/generated/source/buildConfig/release/uy/viatraslados/conductor/BuildConfig.java"
            test -s "$cfg"
            grep -Eq 'VIA_PRODUCTION = true;' "$cfg"
            for flag in VIA_PREVIEW VIA_DENSE_PREVIEW VIA_BUSINESS_PREVIEW VIA_LAYOUT_PREVIEW VIA_OPERATION_PREVIEW VIA_ONLINE_QA VIA_ONBOARD_QA; do
              grep -Eq "$flag = false;" "$cfg"
            done
            if [ "$mode" = pilot ]; then grep -Eq 'VIA_DRIVER_PROFILE_QA = false;' "$cfg"; fi
            echo "PHASE: $mode align"
            "$tool/zipalign" -P 16 -f 4 "$src" /tmp/via-aligned.apk
            echo "PHASE: $mode sign with original certificate"
            "$tool/apksigner" sign --ks "$SIGN_DIR/via-traslados-produccion-guardar.p12" --ks-type PKCS12 --ks-key-alias via-traslados-prod --ks-pass env:SIGNPASS --key-pass env:SIGNPASS --out "$dest" /tmp/via-aligned.apk
            echo "PHASE: $mode verify certificate"
            actual="$(cert "$dest")"
            test "$actual" = "$expected" || { echo '::error::Certificate mismatch'; exit 1; }
            echo "PHASE: $mode verify manifest"
            "$tool/aapt" dump badging "$dest" > /tmp/via-badging.txt
            grep -F "package: name='uy.viatraslados.conductor.production' versionCode='$code'" /tmp/via-badging.txt
            grep -F "versionName='$version'" /tmp/via-badging.txt
            "$tool/aapt" dump xmltree "$dest" AndroidManifest.xml > /tmp/via-manifest.txt
            if grep -F 'android:debuggable(0x0101000f)' /tmp/via-manifest.txt; then
              echo '::error::Debuggable attribute present'; exit 1
            fi
            "$tool/zipalign" -c -P 16 4 "$dest"
          done
          unset SIGNPASS
          sha256sum direct-apk/assets/*.apk
          echo VIA_PROD_SIGNED_ORIGINAL_CERT_AND_ROLLBACK_OK
      - name: Check production API and original V35 direct URL
        run: |
          curl -fsSL --retry 3 https://via-traslados-api.marcelof-gx.workers.dev/api/health | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{if(!JSON.parse(s).ok)process.exit(1)})'
          curl -fsSL --retry 3 https://via-traslados-descargas.marcelof-gx.workers.dev/apk/via-traslados-conductor-v35.apk -o /tmp/v35-public.apk
          echo '324c1c5b8ed997ec12e51ba37afe665854d226d4a5dd995a4cc0a531651d65e3  /tmp/v35-public.apk' | sha256sum -c -
      - name: Publish signed rollback before API changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create via-v37-prod-rollback direct-apk/assets/via-traslados-conductor-v3512-rollback.apk --target "$GITHUB_SHA" --title "Vía Traslados V35.12 rollback" --notes "Rollback compatible with V37 production package, original signature, versionCode 3701." --prerelease
          curl -fLsS --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/via-v37-prod-rollback/via-traslados-conductor-v3512-rollback.apk" -o /tmp/via-rollback-public.apk
          cmp direct-apk/assets/via-traslados-conductor-v3512-rollback.apk /tmp/via-rollback-public.apk
      - name: Prepare active API additive candidate and deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/via-live-tools 00611bbde4333203e1b2809863099293c572ce83
          cp scripts/v37-prod-profile-api.py /tmp/via-live-tools/
          mkdir -p /tmp/via-live-tools/v37-profile
          cp -r backend /tmp/via-live-tools/v37-profile/
          cd /tmp/via-live-tools
          python3 v37-prod-profile-api.py prepare
          npx --yes wrangler@4.160.1 versions upload --config v37-profile/wrangler.jsonc
          python3 v37-prod-profile-api.py activate
      - name: Publish verified production APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create via-v37-production direct-apk/assets/via-traslados-conductor-v37.apk --target "$GITHUB_SHA" --title "Vía Traslados V37 Producción" --notes "Perfil de conductor y revisión administrativa integrados, mismo paquete y certificado. Rollback V35.12 disponible." --prerelease
          curl -fLsS --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/via-v37-production/via-traslados-conductor-v37.apk" -o /tmp/via-v37-public.apk
          cmp direct-apk/assets/via-traslados-conductor-v37.apk /tmp/via-v37-public.apk
      - name: Roll back API on failure after activation
        if: failure()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -f /tmp/via-live-tools/v37-profile/activated.json ]; then
            cd /tmp/via-live-tools
            python3 v37-prod-profile-api.py rollback
          fi
