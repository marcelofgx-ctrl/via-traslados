name: "Vía Traslados — Turnstile real para QA aislada"
on:
  push:
    branches: [via-real-auth-qa-isolated-20261121]
    paths:
      - "scripts/via-qa-turnstile-provision.mjs"
      - ".github/workflows/via-qa-turnstile-provision.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: via-isolated-qa-turnstile-20261121
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: "Verificar script seguro y rama de QA"
        run: |
          test "$GITHUB_REF_NAME" = via-real-auth-qa-isolated-20261121
          node --check scripts/via-qa-turnstile-provision.mjs
          grep -Fq "via-traslados-api-auth-qa-20261121" scripts/via-qa-turnstile-provision.mjs
      - name: "Crear o reutilizar únicamente widget Turnstile de QA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/via-qa-turnstile-provision.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: via-real-qa-turnstile-public-sitekey
          path: .qa/qa-sitekey.txt
          retention-days: 30
