name: Via Traslados - verificar interruptor de web QA
on:
  push:
    branches: [via-web-gate-qa]
    paths:
      - "pages/_worker.js"
      - "pages/sw.js"
      - "tests/web-gate.test.mjs"
      - ".github/workflows/via-web-gate-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis, suspensión y acceso administrativo
        run: |
          set -euo pipefail
          node --check pages/_worker.js
          node --check pages/sw.js
          node --test tests/web-gate.test.mjs
          test -f pages/index.html
          test -f pages/conductor.html
          test -f pages/rambla-skyline-v09.webp
