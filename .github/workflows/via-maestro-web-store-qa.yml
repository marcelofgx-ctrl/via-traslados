name: Vía Maestra — web store idempotente QA sin despliegue
on:
  push:
    branches: [via-maestro-web-idempotencia-qa-20261118]
    paths:
      - "scripts/via-v29-store-idempotency-qa.mjs"
      - "tests/via-store-idempotency-qa.test.mjs"
      - ".github/workflows/via-maestro-web-store-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Producir store.js QA solo si el asset real coincide con hash testigo
        run: node scripts/via-v29-store-idempotency-qa.mjs
      - name: Compilar sintaxis del JS producido sin publicar nada
        run: |
          set -euo pipefail
          node --check dist/via-store-v29-idempotencia-qa.js
          node --test tests/via-store-idempotency-qa.test.mjs
      - name: Guardar JS QA solo en artefactos privados
        uses: actions/upload-artifact@v4
        with:
          name: via-store-v29-idempotency-qa-review
          path: dist/via-store-v29-idempotencia-qa.js
          retention-days: 14
          if-no-files-found: error
