name: Vía Traslados — QA acceso pasajeros sin contraseña
on:
  push:
    branches: [via-customer-passwordless-backend-v16]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencia WebAuthn verificada
        run: npm install --no-audit --no-fund
      - name: Validar cuenta, OTP, permisos y código
        run: |
          npm run check
          npm test
      - name: Comprobar empaquetado Worker sin desplegar producción
        run: |
          cat > wrangler-qa.toml <<'EOF'
          name = "via-traslados-api-qa-dryrun"
          main = "backend/worker.js"
          compatibility_date = "2026-11-04"
          [[d1_databases]]
          binding = "DB"
          database_name = "via-traslados-db"
          database_id = "00000000-0000-4000-8000-000000000000"
          EOF
          npx --yes wrangler@4 deploy --dry-run --config wrangler-qa.toml --outdir /tmp/via-dry-run
          test -s /tmp/via-dry-run/worker.js
          echo 'WebAuthn empaquetado; no se publicó ninguna versión.'
