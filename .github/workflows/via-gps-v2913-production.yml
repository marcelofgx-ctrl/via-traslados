name: Vía Traslados — publicar Web V29.1.3 GPS con rollback V29.1.2
on:
  push:
    branches: [via-gps-lowaccuracy-qa-20261120]
    paths: ['.release/via-gps-v2913-authorized.txt']
permissions:
  contents: read
concurrency:
  group: via-traslados-web-production-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Gate de propietario y reconfirmación de V29.1.2 activa
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/via-gps-lowaccuracy-qa-20261120
          grep -Fx OWNER_AUTHORIZED_WEB_V29_1_3_GPS_ONLY_ROLLBACK_V29_1_2 .release/via-gps-v2913-authorized.txt
          python3 scripts/via-gps-v2913-prepare.py
          node scripts/via-gps-v2913-patch.mjs
          node --check gps-v2913-build/assets/reference.js
          node --check scripts/via-gps-v2913-production-guard.mjs
          node --check scripts/via-gps-v2913-browser.mjs
      - name: Restaurar Worker original, quitar solo marca QA y generar manifiesto
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import runpy,pathlib,json,re,hashlib
          c=runpy.run_path('scripts/via-v291-prepare.py')
          out=pathlib.Path('gps-v2913-build')
          assets=out/'assets'
          data=json.loads((out/'manifest.json').read_text())
          def sha(x):return hashlib.sha256(x).hexdigest()
          assert data['baseline_web_version']=='f2575cba-3454-4181-b985-5c627a301384'
          assert data['rollback_web_version']=='f2575cba-3454-4181-b985-5c627a301384'
          for name,expected in data['assets_before'].items():
           if name in ('index.html','reference.js'):continue
           assert sha((assets/name).read_bytes())==expected, name+' cambiado inesperadamente'
          assert sha((assets/'config.js').read_bytes())=='51c35d348defb7f6b804457ffee090642cc609a9c22d57f3521e6a7706247273'
          home=assets/'index.html'
          text=home.read_text()
          regex=r'<div role="status" id="via-gps-qa-banner"[^>]*>GPS QA · V29\.1\.3 · SIN RESERVAS REALES</div>'
          text,num=re.subn(regex,'',text)
          assert num==1, 'Banner QA no es único'
          assert 'content="29.1.3"' in text and 'reference.js?v=29' in text
          assert 'app.js?v=29.1' in text and 'store.js?v=19.1' in text
          assert 'geo-v2/core.mjs?v=3' in text
          home.write_text(text)
          worker=c['get_live_worker_source']()
          assert len(worker)>4000,'Worker de origen no recuperado'
          (out/'worker.mjs').write_text(worker)
          config={'name':'via-traslados-web-prod','main':'worker.mjs','compatibility_date':'2026-11-10',
           'keep_vars':True,'workers_dev':True,
           'assets':{'directory':'./assets','binding':'ASSETS','run_worker_first':['/api/*']}}
          (out/'wrangler.prod.jsonc').write_text(json.dumps(config,indent=2)+'\n')
          data.update({'stage':'READY_TO_DEPLOY','source_commit':'[GIT_SHA_RUNTIME]',
           'webOnly':True,'changed':['index.html','reference.js'],
           'candidate_reference_sha256':sha((assets/'reference.js').read_bytes()),
           'candidate_html_sha256':sha(home.read_bytes()),
           'worker_source_sha256':sha(worker.encode())})
          data['source_commit']=__import__('os').environ['GITHUB_SHA']
          (out/'manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          print('VIA_GPS_V2913_PROD_PACKAGE_READY',json.dumps({
            'files':['index.html','reference.js'],'geoUnchanged':True,'apiUnchanged':True,
            'd1Unchanged':True,'apkUnchanged':True,'rollback':'f2575cba-3454-4181-b985-5c627a301384'}))
          PY
      - name: Preflight estricto antes de modificar producción
        run: |
          set -euo pipefail
          node scripts/via-gps-v2913-production-guard.mjs before
          npx --yes wrangler@4.160.1 deploy --config gps-v2913-build/wrangler.prod.jsonc --dry-run
          npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Publicar solo web con rollback automático si falla
        run: |
          set -Eeuo pipefail
          revertir() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::Falló Web V29.1.3. Ejecutando rollback controlado a V29.1.2"
              node scripts/via-gps-v2913-production-guard.mjs rollback || {
                npx --yes wrangler@4.160.1 rollback f2575cba-3454-4181-b985-5c627a301384 --name via-traslados-web-prod --message 'Rollback V29.1.3' || true
                node scripts/via-gps-v2913-production-guard.mjs rollback || true
              }
            fi
          }
          trap revertir EXIT
          (cd gps-v2913-build && npx --yes wrangler@4.160.1 deploy --config wrangler.prod.jsonc)
          node scripts/via-gps-v2913-production-guard.mjs after
          GPS_TEST_URL=https://viatraslados.com/ node scripts/via-gps-v2913-browser.mjs
          curl -fsSL 'https://viatraslados.com/api/direcciones?mode=reverse&lat=-34.834&lng=-56.012' | python3 -c 'import json,sys;x=json.load(sys.stdin);assert len(x.get("results",[]))>0'
          trap - EXIT
          echo VIA_GPS_V2913_PRODUCTION_FINISHED_AND_VERIFIED
      - name: Guardar evidencia privada de publicación / rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-gps-v2913-production-proof
          path: |
            gps-v2913-release-proof/
            gps-v2913-build/manifest.json
          retention-days: 90
          if-no-files-found: warn
