name: Via Traslados - probar Worker completo premium sin tocar prod
on:
  push:
    branches: [via-premium-flow-qa]
    paths: [".github/workflows/via-ui-worker-stage.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recuperar codigo ACTIVO del Worker y respaldar cada activo publicado
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,re,hashlib,pathlib,urllib.request,urllib.error
          account=os.environ["CF_ACCOUNT_ID"];token=os.environ["CF_TOKEN"]
          base=f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/via-traslados-web-prod"
          req=urllib.request.Request(base+"/deployments",headers={"Authorization":"Bearer "+token})
          with urllib.request.urlopen(req,timeout=30) as res:d=json.load(res)
          latest=d["result"]["deployments"][0]
          assert len(latest["versions"])==1 and latest["versions"][0]["percentage"]==100
          vid=latest["versions"][0]["version_id"]
          print("CURRENT_DEPLOYED_VERSION",vid)
          with urllib.request.urlopen(urllib.request.Request(base+"/versions/"+vid+"/content",headers={"Authorization":"Bearer "+token}),timeout=30) as res:
            data=res.read();content_type=res.headers.get("Content-Type","")
          if "multipart/" in content_type:
            m=re.search("boundary=[\\\"]?([^;\\\"]+)",content_type);assert m
            for p in data.split(b"--"+m.group(1).encode()):
              if b"Content-Disposition" in p and b"\\r\\n\\r\\n" in p and (b".mjs" in p or b".js" in p):
                data=p.split(b"\\r\\n\\r\\n",1)[1].rstrip(b"\\r\\n")
                break
          script=data.decode("utf8")
          assert "correctKnownPortal" in script and "env.ASSETS.fetch(request)" in script
          assert "function directions" in script and "isClosed" in script
          if "const VIA_BOOKING_CSS = " in script:raise AssertionError("Se detectó un Worker de prueba en vez de la versión activa")
          basepath=pathlib.Path("worker-prod-qa")
          assets=basepath/"assets";assets.mkdir(parents=True,exist_ok=True)
          (basepath/"worker-active.mjs").write_text(script)
          names=['index.html','styles.css','premium.css','reference.css','address-autocomplete.css','address-autocomplete.js','app.js','config.js','map.js','reference.js','store.js','sw.js','manifest.webmanifest','rambla-skyline-v09.webp','rambla-skyline.webp','rambla-atmosfera.webp','icon.svg','reserva.html','mis-reservas.html','conductor.html']
          for name in names:
            req=urllib.request.Request("https://viatraslados.com/"+name,headers={"User-Agent":"ViaAssetProtectedSnapshot/1.0"})
            with urllib.request.urlopen(req,timeout=25) as res:
              assert res.status==200,(name,res.status)
              data=res.read(2000000)
            assert data,(name,"empty")
            (assets/name).write_bytes(data)
            print("PRESERVED_ASSET",name,len(data),hashlib.sha256(data).hexdigest()[:8])
          assert b"<title>V\\xc3\\xada Traslados" in (assets/"index.html").read_bytes()
          html=(assets/"index.html").read_text()
          assert html.count("</head>")==1 and html.count("</body>")==1
          html=html.replace("</head>",'<link rel="stylesheet" href="./flow-premium.css?v=1"></head>',1)
          html=html.replace("</body>",'<script src="./flow-premium.js?v=1"></script></body>',1)
          (assets/"index.html").write_text(html)
          for name in ["flow-premium.js","flow-premium.css"]:
            source=pathlib.Path("ui-prod")/name
            assert source.exists()
            (assets/name).write_bytes(source.read_bytes())
          sw=(assets/"sw.js").read_text()
          assert "const VERSION=" in sw, "No se reconoció la versión del Service Worker"
          sw2=re.sub(r"const VERSION='[^']+'","const VERSION='via-ui-premium-20261111-v1'",sw,count=1)
          assert sw2!=sw
          (assets/"sw.js").write_text(sw2)
          (basepath/"active-version.txt").write_text(vid)
          conf={"name":"via-traslados-web-premium-qa","main":"worker-active.mjs","compatibility_date":"2026-11-10","keep_vars":True,"assets":{"directory":"./assets","binding":"ASSETS","run_worker_first":["/api/*"]}}
          (basepath/"wrangler.json").write_text(json.dumps(conf,indent=2))
          print("SAFE_ASSET_SNAPSHOT_COMPLETE",len(names)+2,"current_worker_version",vid)
          PY
      - name: Probar compilacion de los mismos activos y codigo de produccion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check worker-prod-qa/worker-active.mjs
          node --check worker-prod-qa/assets/flow-premium.js
          npx --yes wrangler@4 deploy --config worker-prod-qa/wrangler.json --dry-run --outdir .ci-worker-preview
          echo "WORKER_BUILD_PASS"
      - name: Publicar solamente Worker aislado de QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config worker-prod-qa/wrangler.json --keep-vars
      - name: Verificar HTML, CSS, JS y busqueda del Worker independiente
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          base="https://via-traslados-web-premium-qa.marcelof-gx.workers.dev"
          def get(path):
            req=urllib.request.Request(base+path,headers={'User-Agent':'ViaWorkerPreview/1.0'})
            with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==200
              return r.read().decode('utf8','replace')
          html=get("/")
          assert 'flow-premium.css?v=1' in html and 'flow-premium.js?v=1' in html
          assert 'id="booking-form"' in html
          assert 'body.premium-page.in-booking' in get("/flow-premium.css")
          assert 'Confirmá tu recorrido' in get("/flow-premium.js")
          j=json.loads(get("/api/direcciones?q=Aeropuerto%20de%20Carrasco"))
          assert j.get("results"),j
          print('WORKER_ISOLATED_FULL_STACK_QA_OK',base)
          print('PRODUCTION_UNCHANGED')
          PY
