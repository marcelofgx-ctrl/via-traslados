name: Vía Traslados - D1 PROD admin-only PREDELETE READ ONLY
on:
  push:
    branches: [via-d1-prod-admin-only-audit-20261122]
    paths: [".github/workflows/via-d1-admin-only-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only D1 production account and table inventory, founder identity and recovery bookmark
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/via-d1-admin-only-predelete-audit.mjs
