name: Vía Traslados — confirmar secreto Geoapify sin exponerlo
on:
  push:
    branches: [via-geoapify-secret-audit-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identificar exclusivamente la D1 de Vía Traslados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-d1.mjs
      - name: Generar configuración de Worker sin alterar el servicio
        env:
          VIA_PUBLIC_ORIGIN: ${{ vars.VIA_PUBLIC_ORIGIN }}
          VIA_RESEND_FROM: ${{ vars.VIA_RESEND_FROM }}
        run: |
          set -euo pipefail
          node scripts/create-wrangler.mjs
          grep -Fx 'name = "via-traslados-api"' wrangler.toml
      - name: Verificar únicamente el nombre del secreto en Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config wrangler.toml > /tmp/via-secret-names.json
          node -e '
            const fs=require("fs");
            const secrets=JSON.parse(fs.readFileSync("/tmp/via-secret-names.json","utf8"));
            if(!Array.isArray(secrets))throw new Error("No fue posible verificar secretos");
            const names=new Set(secrets.map(item=>item.name));
            console.log("Geoapify secret en producción: "+(names.has("VIA_GEOAPIFY_API_KEY")?"PRESENTE":"AUSENTE"));
            if(!names.has("VIA_GEOAPIFY_API_KEY"))process.exitCode=1;
          '
          rm -f /tmp/via-secret-names.json
      - name: Verificar servicio sin autenticarse ni consultar reservas
        run: |
          set -euo pipefail
          BASE=https://via-traslados-api.marcelof-gx.workers.dev
          curl -fsS --max-time 15 "$BASE/api/health" -o /tmp/via-health.json
          node -e 'const j=require("/tmp/via-health.json");if(j.ok!==true)process.exit(1);console.log("API Vía Traslados disponible")'
          [ "$(curl -sS --max-time 15 -o /tmp/via-protected-route.json -w '%{http_code}' "$BASE/api/operator/requests/VIA-TEST/route")" = "401" ]
          echo 'Ruta de reservas protegida por autenticación'
