name: Vía Traslados V3 - prueba real de kilometraje sin reservas
on:
  push:
    branches: [via-passenger-v3-pages]
    paths: [".github/workflows/via-v3-route-real-smoke.yml"]
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar solo dos lugares públicos y comprobar ruta real
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          url='https://via-traslados-api.marcelof-gx.workers.dev/api/public/route-preview'
          payload={'origin':'Montevideo Shopping, Montevideo, Uruguay',
                   'destination':'Aeropuerto Internacional de Carrasco, Canelones, Uruguay'}
          request=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',
            headers={'Origin':'https://viatraslados.com','Content-Type':'application/json','User-Agent':'ViaV3RouteQA/1.0'})
          try:
            with urllib.request.urlopen(request,timeout=35) as response:
              data=json.load(response)
              print('ROUTE_STATUS',response.status,'KM',data.get('distanceKm'),'MIN',data.get('durationMinutes'),'CACHED',data.get('cached'))
              assert response.status==200
              assert 2<data.get('distanceKm',0)<100 and 5<data.get('durationMinutes',0)<180
              assert data.get('source')=='Geoapify'
              assert data.get('trafficIncluded') is False
              print('REAL_ROUTE_OK_NO_BOOKING_OR_EMAIL')
          except urllib.error.HTTPError as error:
            print('ROUTE_ERROR_STATUS',error.code,'BODY',error.read(900).decode('utf8','replace'))
            raise
          PY
