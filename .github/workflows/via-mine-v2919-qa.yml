name: Via Traslados — V29.1.9 premium header exact QA Android iOS
on:
  push:
    branches: [via-mine-exact-brand-prod-20261121]
    paths:
      - ".github/workflows/via-mine-v2919-qa.yml"
      - "scripts/via-mine-v2919-*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: via-mine-v2919-qa
  cancel-in-progress: true
jobs:
  brand_and_keyboard_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deterministic source and browser test syntax
        run: |
          python3 -m py_compile scripts/via-mine-v2919-release.py
          node --check scripts/via-mine-v2919-brand-qa.mjs
          node --check scripts/via-mine-v2918-keyboard-qa.mjs
          node --check scripts/via-mine-v2917-browser.mjs
      - name: Generate V29.1.9 from immutable real V29.1.6 Cloudflare Worker snapshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-mine-v2919-release.py prepare
      - name: Deploy isolated stage, never production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.160.1 deploy --config mine-v2917-build/wrangler.v2918.qa.jsonc
          python3 scripts/via-mine-v2919-release.py qa
      - name: Install browser engines for Android Chrome and iPhone WebKit
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps webkit >/dev/null
      - name: Verify screenshot-specific bug with keyboard in eight viewport cases
        env:
          VIA_V2918_QA: https://via-traslados-mine-v2917-stage.marcelof-gx.workers.dev
        run: node scripts/via-mine-v2918-keyboard-qa.mjs
      - name: Verify logged-in reservations and pagination in seven cases
        env:
          VIA_MINE_PREMIUM_QA: https://via-traslados-mine-v2917-stage.marcelof-gx.workers.dev/
        run: node scripts/via-mine-v2917-browser.mjs
      - name: Verify approved V logo and Inicio button in eight cases
        run: node scripts/via-mine-v2919-brand-qa.mjs
      - name: Save screenshots and proven snapshot inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-mine-v2919-premium-header-visual-qa
          path: |
            mine-v2917-proof/
            mine-v2918-proof/
            mine-v2919-proof/
            mine-v2917-build/manifest.json
          if-no-files-found: warn
          retention-days: 21
