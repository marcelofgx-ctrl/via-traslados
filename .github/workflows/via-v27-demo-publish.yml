name: Vía Traslados V27 - publicar APK demo aislada
on:
  push:
    branches: [via-solicitudes-compactas-v27-qa-20261112]
    paths: [".github/workflows/via-v27-demo-publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: via-v27-demo-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar y verificar demo V27 exclusiva, sin conexión a producción
        run: |
          set -euo pipefail
          grep -q 'PREVIEW_LOCAL_NO_NETWORK' android-driver/app/src/main/java/uy/viatraslados/conductor/MainActivity.java
          grep -q 'ViaPreviewData.requests()' android-driver/app/src/main/java/uy/viatraslados/conductor/MainActivity.java
          gradle -p android-driver :app:assembleDebug -PviaPreview=true --no-daemon
          APK=android-driver/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "name='uy.viatraslados.conductor.v27preview'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='27'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -t "$APK" | tail -2
      - name: Copiar exclusivamente el instalador ficticio V27 a la web QA
        run: |
          set -euo pipefail
          git fetch --no-tags origin via-apk-descarga-qa-20261112
          git worktree add /tmp/via-site FETCH_HEAD
          mkdir -p /tmp/via-site/qa-apk-download/v27-preview
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk /tmp/via-site/qa-apk-download/v27-preview/via-conductor-v27-demo.apk
          cd /tmp/via-site/qa-apk-download/v27-preview
          sha256sum via-conductor-v27-demo.apk > SHA256SUMS.txt
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="es-UY"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vía Traslados · V27 Demo</title>
          <style>html{font-family:system-ui,sans-serif;background:#f4f8f8;color:#20393b}body{max-width:510px;margin:32px auto;padding:16px}main{background:white;border:1px solid #e3ebeb;border-radius:20px;padding:25px}h1{font-size:25px}p{line-height:1.6;color:#607477}a.download{display:block;background:#006e70;color:white;text-decoration:none;font-weight:700;text-align:center;padding:15px;border-radius:11px}small{color:#607477}</style>
          </head><body><main><small>VÍA TRASLADOS · DEMO INDEPENDIENTE</small><h1>Solicitudes premium · V27</h1>
          <p>Nuevo listado compacto, con pestañas, búsqueda, orden, filtros y tarjetas mejor organizadas. Incluye cinco solicitudes ficticias para probar la interfaz.</p>
          <a class="download" href="./via-conductor-v27-demo.apk" download>Descargar APK V27 Demo</a>
          <p>No necesita usuario ni contraseña. No envía datos al servidor ni modifica reservas reales. Se instala junto a la APK operativa y la demo anterior, con un identificador independiente.</p>
          <p><small>APK de evaluación con firma de depuración. Las rutas son ilustrativas, no estimaciones operativas.</small></p>
          </main></body></html>
          HTML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f via-conductor-v27-demo.apk
          git add index.html SHA256SUMS.txt
          git commit -m "qa(via): publicar V27 Demo con lista compacta, sin acceso a producción"
          git push origin HEAD:via-apk-descarga-qa-20261112
