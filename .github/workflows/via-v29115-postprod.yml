name: Via V29.1.15 — independent READ ONLY postproduction audit
on:
  push:
    branches: [via-address-picker-v29115-20261123]
    paths: [".github/workflows/via-v29115-postprod.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare effective Worker, text, scripts, prior rollback and unchanged APK/core by hashes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-v29115-postprod.py
      - name: Verify public API/OTP/CORS, georouting and APK without writes
        run: node tests/prod-core-invariants.mjs
