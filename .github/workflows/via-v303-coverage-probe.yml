name: "Vía V30.3 — diagnóstico de cobertura"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths: [".github/workflows/via-v303-coverage-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node scripts/v303-coverage-probe.mjs
