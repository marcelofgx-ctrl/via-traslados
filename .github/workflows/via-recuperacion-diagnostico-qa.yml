name: Via Traslados - diagnóstico no invasivo de recuperación
on:
  push:
    branches: [via-recuperacion-diagnostico-qa-20261112]
    paths: [".github/workflows/via-recuperacion-diagnostico-qa.yml"]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar solo indicadores agregados en D1 exclusiva de Via Traslados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token || !/^[a-f0-9]{32}$/.test(account||''))throw Error('Credenciales no configuradas');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          const headers={Authorization:'Bearer '+token,Accept:'application/json'};
          const list=await fetch(base+'/d1/database?name=via-traslados-db',{headers,signal:AbortSignal.timeout(15000)});
          if(!list.ok)throw Error('Consulta de base falló con HTTP '+list.status);
          const body=await list.json();
          const databases=(body.result||[]).filter(d=>d.name==='via-traslados-db');
          if(!body.success||databases.length!==1)throw Error('Base de Vía Traslados no identificada de manera única');
          const uuid=databases[0].uuid;
          const sql=`SELECT
          (SELECT COUNT(*) FROM staff_users) AS total_staff,
          (SELECT COUNT(*) FROM staff_contacts) AS with_phone,
          (SELECT COUNT(*) FROM staff_contacts WHERE email_verified_at IS NOT NULL) AS verified_emails,
          (SELECT COUNT(*) FROM staff_contacts WHERE email_verified_at IS NULL) AS unverified_emails,
          (SELECT COUNT(*) FROM staff_password_resets WHERE sent_at>unixepoch()-7200) AS password_reset_codes_last_2h,
          (SELECT COUNT(*) FROM staff_email_codes WHERE sent_at>unixepoch()-7200) AS verification_codes_last_2h`;
          const q=await fetch(base+'/d1/database/'+uuid+'/query',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(15000)});
          if(!q.ok)throw Error('Lectura D1 falló con HTTP '+q.status);
          const j=await q.json();
          if(j.success!==true||!Array.isArray(j.result)||!Array.isArray(j.result[0]?.results))throw Error('Respuesta D1 inesperada');
          const metrics=j.result[0].results[0];
          console.log('Diagnóstico D1: solo cantidades agregadas, sin revelar teléfonos, correos, códigos o contraseñas.');
          console.log(JSON.stringify(metrics));
          NODE
