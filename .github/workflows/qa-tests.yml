name: Via Traslados - QA funcional
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar código cargado
        run: |
          test -f backend/worker.js
          test -f backend/auth.js
          test -d tests
      - name: Pruebas reales del backend
        run: npm test
      - name: Verificar sintaxis
        run: npm run check
