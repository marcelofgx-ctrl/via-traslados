name: Vía Maestra — Android identidad QA aislada
on:
  push:
    branches: [via-maestro-android-identidad-qa-20261118]
    paths:
      - "android-driver/**"
      - "tests/android-session-generation.test.mjs"
      - ".github/workflows/via-maestro-android-session-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Probar backend y contratos de aislamiento
        run: |
          set -euo pipefail
          npm test
          npm run check
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - name: Preparar Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de ensayos sin tocar paquete productivo
        run: |
          set -euo pipefail
          gradle -p android-driver :app:assembleDebug -PviaProduction=true --no-daemon
          APK=android-driver/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='uy.viatraslados.conductor.productionrc'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -t "$APK" | tail -2
          mkdir -p dist
          cp "$APK" dist/via-conductor-identidad-qa-android-debug.apk
          (cd dist && sha256sum via-conductor-identidad-qa-android-debug.apk > SHA256SUMS.txt)
      - name: Confirmar que V34 QA también compila
        run: |
          set -euo pipefail
          gradle -p android-driver :app:assembleDebug -PviaCatalogQa=true --no-daemon
          APK=android-driver/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='uy.viatraslados.conductor.v34catalogqa'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
      - name: Guardar QA únicamente en artefactos privados, no publicar
        uses: actions/upload-artifact@v4
        with:
          name: via-android-session-guard-qa-private
          path: dist/*
          retention-days: 14
          if-no-files-found: error
