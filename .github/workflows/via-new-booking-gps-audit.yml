name: Vía Traslados - focused read-only production GPS address source audit
on:
  push:
    branches: [via-new-booking-origin-readonly-20261122]
    paths: [".github/workflows/via-new-booking-gps-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gps:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/via-new-booking-gps-audit.mjs
