name: Vía V31.1 — QA preflight (read only)
on:
  push:
    branches: [via-hourly-service-v31-qa-20261125]
    paths: ['.github/workflows/via-v311-qa-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    if: github.ref == 'refs/heads/via-hourly-service-v31-qa-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect active deployments, QA bindings, schema and recovery availability
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          assert(/^[a-f0-9]{32}$/i.test(a||'')&&t,'Missing authorized Cloudflare connection');
          const qa='146017ce-09a7-4457-abd2-694a5a5b3e92', prod='dfc6a732-4817-4c49-8f2b-16ecaff3ecc0';
          const root='https://api.cloudflare.com/client/v4/accounts/'+a;
          async function call(p,body){
            const r=await fetch(root+p,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000)});
            const v=await r.json().catch(()=>({}));
            assert(r.ok&&v.success,'Cloudflare read failed: HTTP '+r.status+' '+p);
            return v.result;
          }
          const names=['via-traslados-web-prod','via-traslados-api','via-traslados-api-qa'];
          for(const name of names){
            const p='/workers/scripts/'+name;
            const d=await call(p+'/deployments');
            const active=d.deployments?.[0]?.versions||[];
            console.log('ACTIVE '+name+' '+JSON.stringify(active.map(v=>({id:v.version_id,traffic:v.percentage}))));
            if(name==='via-traslados-api-qa'){
              assert(active.length===1&&active[0].percentage===100,'QA active version ambiguous');
              const s=await call(p+'/versions/'+active[0].version_id);
              const bindings=s.resources?.bindings;
              assert(Array.isArray(bindings),'Active version bindings unavailable');
              const safe=bindings.map(b=>({name:b.name,type:b.type,...(b.type==='d1'?{id:b.id||b.database_id}:{})}));
              console.log('QA_BINDINGS '+JSON.stringify(safe));
              assert(safe.some(b=>b.name==='DB'&&b.type==='d1'&&b.id===qa),'QA DB binding not verified');
              assert(!safe.some(b=>b.id===prod),'Production binding on QA');
            }
          }
          const db=await call('/d1/database/'+qa);
          assert(db.name==='via-traslados-qa-db','Unexpected QA database');
          console.log('QA_DB '+JSON.stringify({name:db.name,uuid:qa}));
          async function query(sql){
            const v=await call('/d1/database/'+qa+'/query',{sql,params:[]});
            assert(v[0]?.success,'Schema query failed');
            return v[0].results;
          }
          const schema=await query("SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','trigger','index','view') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY type,name");
          for(const s of schema)console.log('QA_SCHEMA '+JSON.stringify(s));
          const fk=await query('PRAGMA foreign_key_list(booking_quotes)');
          console.log('QA_QUOTE_FK '+JSON.stringify(fk));
          const bookmark=await call('/d1/database/'+qa+'/time_travel/bookmark');
          assert(typeof bookmark.bookmark==='string'&&bookmark.bookmark.length>20,'Recovery not available');
          console.log('QA_TIME_TRAVEL_AVAILABLE true (refresh and retain bookmark privately before migration)');
          console.log('QA_PREFLIGHT_PASS no deployment, no data rows read, no database writes');
          JS
