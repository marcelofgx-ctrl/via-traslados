name: Via Traslados - publicar APK celular y huella
on:
  push:
    branches: [worker-web-release]
    paths: [".github/workflows/via-phone-bio-download.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: via-web-gate-prod
  cancel-in-progress: false
jobs:
  apk_download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtener APKs exclusivas de Vía Traslados y validar hashes
        run: |
          set -euo pipefail
          mkdir -p pages/descargas /tmp/via-old /tmp/via-new
          gh release download via-admin-qa-v0.2.1 --repo marcelofgx-ctrl/via-traslados \
            --pattern 'via-traslados-admin-qa-v0.2.1.apk' --pattern 'SHA256SUMS.txt' \
            --dir /tmp/via-old
          gh release download via-phone-bio-qa-v0.3.0 --repo marcelofgx-ctrl/via-traslados \
            --pattern 'via-traslados-telefono-huella-qa-v0.3.0.apk' --pattern 'SHA256SUMS.txt' \
            --dir /tmp/via-new
          (cd /tmp/via-old && sha256sum -c SHA256SUMS.txt)
          (cd /tmp/via-new && sha256sum -c SHA256SUMS.txt)
          cp /tmp/via-old/*.apk pages/descargas/
          cp /tmp/via-new/*.apk pages/descargas/
          unzip -t pages/descargas/via-traslados-telefono-huella-qa-v0.3.0.apk | tail -2
          test "$(stat -c '%s' pages/descargas/via-traslados-telefono-huella-qa-v0.3.0.apk)" -gt 1000000
      - name: Verificar proyecto correcto y portada protegida
        run: |
          set -euo pipefail
          test -f pages/index.html
          test -f pages/conductor.html
          grep -F '"name": "via-traslados-web-prod"' wrangler.via-web.jsonc
          grep -F '"pattern": "viatraslados.com"' wrangler.via-web.jsonc
          node --check pages/_worker.js
          node --check pages/sw.js
          node --test tests/web-gate.test.mjs
      - name: Publicar APKs sin alterar backend ni DNS de Resend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.via-web.jsonc
      - name: Verificar descarga pública con bytes idénticos
        run: |
          set -euo pipefail
          URL=https://viatraslados.com/descargas/via-traslados-telefono-huella-qa-v0.3.0.apk
          for n in 1 2 3 4 5 6; do
             curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$URL" -o /tmp/via-new-live.apk && break
             sleep 3
          done
          test -s /tmp/via-new-live.apk
          cmp pages/descargas/via-traslados-telefono-huella-qa-v0.3.0.apk /tmp/via-new-live.apk
          unzip -t /tmp/via-new-live.apk | tail -2
          curl -fsSL https://viatraslados.com/ -o /tmp/via-public.html
          grep -q 'Vía Traslados' /tmp/via-public.html
          curl -fsSL https://viatraslados.com/conductor.html -o /tmp/via-driver.html
          grep -q 'ACCESO PRIVADO' /tmp/via-driver.html
          echo 'APK Android celular+huella descargable, página y acceso privado verificados'
