name: Vía Traslados V30 — safeguarded passenger web PRODUCTION and rollback
on:
  push:
    branches: [via-v30-mvp-operativo-20261123]
    paths: ["release/VIA_V30_WEB_QA_APPROVED"]
permissions:
  contents: read
  actions: read
concurrency:
  group: via-traslados-web-prod-review-v29-release
  cancel-in-progress: false
jobs:
  publish-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require exact successful API and most recent browser QA and unchanged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/VIA_V30_WEB_QA_APPROVED
          test -s release/VIA_V30_API_ACTIVE
          grep -Fx '9349f01a-5824-4401-848f-edb4f3f7d5b0' release/VIA_V30_API_ACTIVE
          for run in 45191185138 45193233229 45193418469; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          done
          QA_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45193418469" --jq .head_sha)"
          test -z "$(git diff --name-only "$QA_SHA"..HEAD -- scripts/v30-web-app.js scripts/v30-web-store.js scripts/v30-web-release.py audit/v30-baseline-app.js audit/v30-baseline-store.js)"
          echo 'VIA_V30_WEB_QA_SHA_APPROVED'
      - name: Verify unchanged live web V29.1.16 and V30 API Worker known active
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -m py_compile scripts/v30-web-release.py
          node --check scripts/v30-web-app.js
          node --check scripts/v30-web-store.js
          python3 -c "import runpy;f=runpy.run_path('scripts/via-v291-prepare.py');assert f['active_version']()=='f46757df-8ff2-4653-bec3-e15b8394a99a','Web changed before release'"
      - name: Rebuild original production web bundle and verify protected GPS and signed APK hashes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/v30-web-release.py prepare
      - name: Validate isolated QA web and Cloudflare production dry-run with no writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/v30-web-release.py qa
          npx --yes wrangler@4.160.1 deploy --config v30-mvp-web-build/wrangler.prod.jsonc --dry-run --keep-vars
      - name: Publish real V30 passenger web ONLY after API active, rollback if verification fails
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/v30-web-release.py release
      - name: Independently confirm V30 web, OTP, real 20+km route, geocoder and APK
        run: |
          node scripts/v30-prod-core-invariants.mjs
          node scripts/v30-prod-coordinates-smoke.mjs
      - name: Archive original assets, hashes and exact web rollback ID
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-v30-web-production-manifest-rollback
          path: v30-mvp-web-build/manifest.json
          retention-days: 30
          if-no-files-found: warn
