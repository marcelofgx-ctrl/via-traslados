name: Vía Traslados — construir Web V29.1.0-RC1 SIN desplegar
on:
  push:
    branches: [via-web-v29-1-rc1-20261119]
    paths:
      - "scripts/via-v291-*"
      - ".github/workflows/via-web-v291-build-only.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validar scripts de build
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/via-v291-prepare.py
          node --check scripts/via-v291-store-rc.mjs
          node --check scripts/via-v291-mine-rc.mjs
          node --check scripts/via-v291-home-account.js
          node --check scripts/via-v291-browser-rc.mjs
      - name: Generar JS y HTML de producción desde hashes reales
        run: |
          set -euo pipefail
          node scripts/via-v291-store-rc.mjs
          node scripts/via-v291-mine-rc.mjs
          node --check dist/via-v291-store.js
          node --check dist/via-v291-app.js
      - name: Armar paquete inmutable con Worker original y assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-v291-prepare.py prepare
      - name: Validar Cloudflare por dry-run, sin despliegue
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.160.1 deploy --config via-v291-rc-build/wrangler.candidate-stage.jsonc --dry-run
      - name: Probar pantallas móviles 320/360/390/412 sin tocar API ni D1 real
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.58.2
          command -v google-chrome
          node scripts/via-v291-browser-rc.mjs
      - name: Comprobar que la candidata no contiene datos o bypass QA
        run: |
          set -euo pipefail
          ! grep -R -nE 'window.VIA_QA_|QA · Cuentas|@qa.invalid|via-maestro-api|Idempotency-Key' via-v291-rc-build/assets/app.js via-v291-rc-build/assets/store.js via-v291-rc-build/assets/index.html via-v291-rc-build/assets/mis-reservas.html
          test "$(sha256sum via-v291-rc-build/assets/geo-v2/core.mjs | awk '{print $1}')" = '17a9ef5d2396d595e6d0847b0b32da80244f75084ced89cad485ff22377509c1'
          echo VIA_V291_RC1_NO_PRODUCTION_CHANGES
      - name: Conservar paquete y manifiesto para revisión y rollback
        uses: actions/upload-artifact@v4
        with:
          name: via-web-v291-rc1-no-publicado
          path: |
            via-v291-rc-build/
          retention-days: 30
          if-no-files-found: error
