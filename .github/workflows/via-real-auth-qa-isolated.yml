name: "Vía Traslados — Backend real y D1 QA totalmente aislados"
on:
  push:
    branches: [via-real-auth-qa-isolated-20261121]
    paths:
      - ".github/workflows/via-real-auth-qa-isolated.yml"
      - "backend/qa-entry.js"
      - "scripts/via-qa-isolated-*.mjs"
      - "tests/qa-isolated-backend.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: via-auth-backend-isolated-qa-20261121
  cancel-in-progress: false
jobs:
  isolated-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: "Proteger ramas y nombres productivos"
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = via-real-auth-qa-isolated-20261121
          test -f backend/qa-entry.js
          test -f backend/schema.sql
          grep -Fq "via-traslados-db-auth-qa-20261121" scripts/via-qa-isolated-provision.mjs
          grep -Fq "via-traslados-api-auth-qa-20261121" scripts/via-qa-isolated-provision.mjs
          test ! -e .qa/wrangler-backend.toml
          echo "ISOLATED_QA_ONLY: production Worker and D1 names are forbidden."
      - name: "Validar código, seguridad y esquema SQLite sin tocar Cloudflare"
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm test
          node --check backend/qa-entry.js
          node --check scripts/via-qa-isolated-provision.mjs
          node --check scripts/via-qa-isolated-secrets.mjs
          python3 - <<'PY'
          import sqlite3,pathlib
          db=sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          schema=pathlib.Path('backend/schema.sql').read_text()
          db.executescript(schema);db.executescript(schema)
          names={x[0] for x in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          must={'bookings','booking_events','customers','customer_sessions','customer_passkeys','customer_pins','email_otp_codes','otp_rate_limits'}
          assert must<=names,sorted(must-names)
          assert db.execute('SELECT COUNT(*) FROM bookings').fetchone()[0]==0
          print('QA_SCHEMA_IDEMPOTENT_AND_EMPTY_OK')
          PY
      - name: "Crear o identificar ÚNICAMENTE D1 QA, nunca D1 producción"
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIA_QA_RESEND_FROM: \${{ vars.VIA_RESEND_FROM }}
        run: |
          set -euo pipefail
          node scripts/via-qa-isolated-provision.mjs
          grep -Fx 'name = "via-traslados-api-auth-qa-20261121"' .qa/wrangler-backend.toml
          grep -Fx 'database_name = "via-traslados-db-auth-qa-20261121"' .qa/wrangler-backend.toml
          ! grep -Fx 'database_name = "via-traslados-db"' .qa/wrangler-backend.toml
          ! grep -Fx 'name = "via-traslados-api"' .qa/wrangler-backend.toml
      - name: "Compilar Worker QA sin desplegar"
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 deploy --config .qa/wrangler-backend.toml --dry-run --outdir /tmp/via-auth-qa-dryrun
          test -s /tmp/via-auth-qa-dryrun/qa-entry.js
      - name: "Aplicar esquema SQL únicamente en D1 QA"
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 d1 execute via-traslados-db-auth-qa-20261121 --remote \
            --config .qa/wrangler-backend.toml --file backend/schema.sql
      - name: "Desplegar únicamente Worker de API QA"
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 deploy --config .qa/wrangler-backend.toml --keep-vars
      - name: "Configurar secretos EXCLUSIVOS del Worker QA, sin mostrarlos"
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIA_QA_RESEND_API_KEY: \${{ secrets.VIA_QA_RESEND_API_KEY }}
          VIA_QA_TURNSTILE_SECRET_KEY: \${{ secrets.VIA_QA_TURNSTILE_SECRET_KEY }}
          VIA_QA_GEOAPIFY_API_KEY: \${{ secrets.VIA_QA_GEOAPIFY_API_KEY }}
          VIA_QA_TEST_EMAILS: \${{ secrets.VIA_QA_TEST_EMAILS }}
        run: |
          set -euo pipefail
          node scripts/via-qa-isolated-secrets.mjs
      - name: "Verificar endpoint real de QA sin enviar correo ni crear reservas"
        run: |
          set -euo pipefail
          BASE=https://via-traslados-api-auth-qa-20261121.marcelof-gx.workers.dev
          for i in $(seq 1 12); do
            STATUS=$(curl -sS --max-time 15 -o /tmp/qa-health.json -w '%{http_code}' "$BASE/api/health" || true)
            if [ "$STATUS" = 200 ]; then break; fi
            sleep 2
          done
          test "$STATUS" = 200
          node -e "let d=require('/tmp/qa-health.json'); if(d.ok!==true||d.qaIsolated!==true||typeof d.otpAvailable!=='boolean')process.exit(1); console.log('QA_AUTH_BACKEND_OK; otpConfigured='+d.otpAvailable+'; isolated='+d.qaIsolated)"
          STATUS=$(curl -sS --max-time 15 -o /tmp/qa-prod-origin.json -w '%{http_code}' -H 'Origin: https://viatraslados.com' "$BASE/api/health")
          test "$STATUS" = 403
          STATUS=$(curl -sS --max-time 15 -o /tmp/qa-unknown-email.json -w '%{http_code}' \
            -H 'Origin: https://via-traslados-current-prod-qa.marcelof-gx.workers.dev' \
            -H 'Content-Type: application/json' \
            -X POST --data '{"email":"not-allowed@invalid.example"}' "$BASE/api/auth/start")
          test "$STATUS" = 403
          echo 'QA_AUTH_ISOLATED_AND_PRODUCTION_DENIED'
