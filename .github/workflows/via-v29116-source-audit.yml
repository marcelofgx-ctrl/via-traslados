name: Via V29.1.16 - snapshot live V29.1.15 reference code READ ONLY
on:
  push:
    branches: [via-ui-date-map-v29116-20261123]
    paths: [".github/workflows/via-v29116-source-audit.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact Cloudflare production Worker V29.1.15
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -c "import runpy;p=runpy.run_path('scripts/via-v291-prepare.py');assert p['active_version']()=='e7830749-95f0-4a0e-8781-0e2ae6a19466','Unexpected live Worker';print('VIA_V29116_LIVE_PRECHECK_PASS')"
      - name: Capture publicly served source without modifying anything
        run: node scripts/via-v29116-source-audit.mjs
      - name: Retain exact web source and hashes in isolated working branch
        run: |
          git config user.name via-traslados-ci
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/live-v29115/
          git commit -m "audit: snapshot exact live V29.1.15 website for surgical visual v29.1.16" || true
          git push origin HEAD:via-ui-date-map-v29116-20261123
