name: "Vía V30 — POI navegador Android/iOS QA sin escrituras"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths:
      - "scripts/v30-poi-frontend-patch.mjs"
      - "scripts/v30-poi-browser-e2e.mjs"
      - ".github/workflows/via-v30-poi-browser-isolated-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Generar parche QA del autocomplete realmente servido
        run: |
          set -euo pipefail
          mkdir -p v30-poi-browser-proof
          curl -fsSL --retry 3 'https://viatraslados.com/address-autocomplete.js' -o v30-poi-browser-proof/address-autocomplete-original.js
          node scripts/v30-poi-frontend-patch.mjs v30-poi-browser-proof/address-autocomplete-original.js v30-poi-browser-proof/address-autocomplete-qa.js
          node --check v30-poi-browser-proof/address-autocomplete-qa.js
      - name: Instalar navegadores Android Chrome y Safari WebKit
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps webkit >/dev/null
      - name: Probar selección POI, metadatos, rutas y portal sin tocar producción
        run: node scripts/v30-poi-browser-e2e.mjs
      - name: Conservar capturas sin credenciales ni identidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-v30-poi-browser-qa
          path: |
            v30-poi-browser-proof/*.png
          retention-days: 10
          if-no-files-found: ignore
