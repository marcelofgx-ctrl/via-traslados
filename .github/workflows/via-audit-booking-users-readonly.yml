name: Vía Traslados — comprobar nueva reserva y usuarios (solo lectura)
on:
  push:
    branches: [via-audit-reserva-usuarios-readonly-20261118]
    paths: [".github/workflows/via-audit-booking-users-readonly.yml", "scripts/v35_verify_new_booking_users_readonly.mjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Consultar D1 real SOLO SELECT, sin publicar datos privados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/v35_verify_new_booking_users_readonly.mjs
