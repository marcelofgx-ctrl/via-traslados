name: Vía Traslados ADR-001 — metadata-only architecture baseline (NO WRITES)
on:
  push:
    branches: [via-integridad-arquitectura-20261123]
    paths: [".github/workflows/via-architecture-phase0-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Cloudflare deployed web/API IDs and D1 column metadata; no bookings or coordinates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/via-architecture-phase0-readonly.mjs
