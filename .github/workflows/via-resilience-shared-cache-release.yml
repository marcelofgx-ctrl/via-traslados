name: Vía — shared verified portal cache fix and guarded production activation
on:
  push:
    branches: [via-geography-resilience-20261126]
    paths: ['.github/workflows/via-resilience-shared-cache-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: via-v30-poi-prod-api-web-atomic
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/via-geography-resilience.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: via-resilience-candidate
          run-id: 45836917606
          github-token: ${{ github.token }}
          path: via-resilience
      - uses: actions/download-artifact@v4
        with:
          name: via-resilience-web-candidate
          run-id: 45837199065
          github-token: ${{ github.token }}
          path: via-resilience
      - run: python3 scripts/via-resilience-shared-cache-build.py prepare
      - run: npx --yes wrangler@4.160.1 versions upload --config via-resilience/wrangler-web.jsonc --keep-vars
      - run: python3 scripts/via-resilience-shared-cache-build.py verify
      - name: Activate additive API only
        id: api
        run: python3 scripts/via-resilience-shared-release.py api
      - name: Verify integrated candidate and shared suggest/resolve cache
        run: node scripts/via-resilience-integration.mjs candidate
      - name: Activate exact web version
        run: python3 scripts/via-resilience-shared-release.py web
      - name: Verify real production address and unchanged functional endpoints
        run: |
          node scripts/via-resilience-integration.mjs prod
          python3 scripts/via-resilience-shared-release.py final
      - name: Roll back both Workers if integration fails
        if: failure() && steps.api.outcome != 'skipped'
        run: python3 scripts/via-resilience-shared-release.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-resilience-shared-cache-report
          path: via-resilience/web-candidate.json
