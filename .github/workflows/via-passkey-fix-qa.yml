name: Vía Traslados - verificar arreglo passkeys sin producción
on:
  push:
    branches: [via-passkey-router-fix-20261111]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/via-passkey-fix-qa.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Testear passkey y toda la API
        run: |
          npm test
          npm run check
      - name: Compilar Worker sin desplegar
        run: |
          cat > wrangler-passkey-dryrun.toml <<'EOF'
          name = "via-passkey-fix-qa"
          main = "backend/worker.js"
          compatibility_date = "2026-11-04"
          [[d1_databases]]
          binding = "DB"
          database_name = "via-traslados-db"
          database_id = "00000000-0000-4000-8000-000000000000"
          EOF
          npx --yes wrangler@4 deploy --dry-run --config wrangler-passkey-dryrun.toml --outdir /tmp/via-passkey-compiled
          echo 'PASSKEY_ROUTE_QA_COMPILED_NO_DEPLOY'
