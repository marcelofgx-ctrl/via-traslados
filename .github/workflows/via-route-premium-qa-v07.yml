name: Vía Traslados — interfaz premium y rutas QA 0.7
on:
  push:
    branches: [via-route-premium-qa-v07]
    paths: [backend/**, android-driver/**, tests/**, .github/workflows/via-route-premium-qa-v07.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: via-route-premium-qa-v07
  cancel-in-progress: true
jobs:
  qa_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar reglas de rutas, permisos, privacidad y regresión
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --check backend/route-estimate.js
          node --check backend/staff-phone.js
          node --check backend/staff.js
      - name: Verificar aislamiento y APK independiente
        run: |
          set -euo pipefail
          FILE=android-driver/app/src/main/java/uy/viatraslados/conductor/MainActivity.java
          grep -F "applicationId 'uy.viatraslados.conductor.routeqa'" android-driver/app/build.gradle
          grep -F 'private void bookingCard(' "$FILE"
          grep -F 'private void calculateRoute(' "$FILE"
          grep -F 'private void passwordResetConfirm(' "$FILE"
          grep -F 'VIA_GOOGLE_ROUTES_KEY' backend/route-estimate.js
          if grep -RiE 'quicktrip|quick-trip' android-driver/app/src/main/java android-driver/app/src/main/AndroidManifest.xml; then exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preparar SDK Android
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK premium 0.7
        run: gradle -p android-driver :app:assembleDebug --no-daemon
      - name: Verificar APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk dist/via-traslados-rutas-premium-qa-v0.7.0.apk
          cd dist
          sha256sum via-traslados-rutas-premium-qa-v0.7.0.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t via-traslados-rutas-premium-qa-v0.7.0.apk | tail -2
          test "$(stat -c '%s' via-traslados-rutas-premium-qa-v0.7.0.apk)" -gt 100000
      - uses: actions/upload-artifact@v4
        with:
          name: via-route-premium-qa-v070
          path: dist/*
          retention-days: 30
      - name: Publicar APK solo para QA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: via-route-premium-qa-v0.7.0
          target_commitish: via-route-premium-qa-v07
          name: "Vía Traslados · Interfaz premium y distancias · QA v0.7.0"
          body: |
            APK independiente de pruebas visuales de Vía Traslados.
            Tarjetas compactas, direcciones legibles y opción de calcular distancia por carretera y minutos.
            El cálculo real necesita activar el backend y configurar VIA_GOOGLE_ROUTES_KEY en Cloudflare.
            No se inventan distancias ni precios. No cambia Quick Trip ni la web pública.
          files: |
            dist/via-traslados-rutas-premium-qa-v0.7.0.apk
            dist/SHA256SUMS.txt
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
