name: Vía V35 — verificación segura de recuperación D1
on:
  push:
    branches: [via-integracion-despacho-backend-v35-20261117]
    paths:
      - "scripts/v35-verify-d1-bookmark.mjs"
      - ".github/workflows/via-v35-d1-bookmark-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Confirmar punto de recuperación disponible, SIN restaurar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/v35-verify-d1-bookmark.mjs
