name: Vía Traslados — GPS Chrome precisión QA aislada
on:
  push:
    branches: [via-gps-precision-qa-20261119]
    paths:
      - "scripts/via-gps-precision-*"
      - ".github/workflows/via-gps-precision-qa.yml"
permissions:
  contents: read
jobs:
  gps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Auditar fuente activa y copiar assets a QA aislada
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/via-gps-precision-prepare.py
          node --check scripts/via-gps-precision-patch.mjs
          node --check scripts/via-gps-precision-browser.mjs
          python3 scripts/via-gps-precision-prepare.py
          node scripts/via-gps-precision-patch.mjs
          node --check gps-precision-build/assets/reference.js
          test "$(sha256sum gps-precision-build/assets/geo-v2/core.mjs | cut -d' ' -f1)" = '17a9ef5d2396d595e6d0847b0b32da80244f75084ced89cad485ff22377509c1'
      - name: Impedir que el laboratorio solicite reservas a API productiva
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gps-precision-build/assets/config.js')
          live=p.read_text()
          assert 'via-traslados-api.marcelof-gx.workers.dev' in live
          p.write_text("window.VIA_CONFIG=Object.freeze({demo:false,apiUrl:'https://via-traslados-maestro-api-qa.marcelof-gx.workers.dev',turnstileSiteKey:''});\n")
          assert 'via-traslados-api.marcelof-gx.workers.dev' not in p.read_text()
          print('VIA_GPS_PREVIEW_API_ISOLATED')
          PY
      - name: Publicar nuevo Worker de QA solamente
        run: |
          set -euo pipefail
          cd gps-precision-build
          npx --yes wrangler@4.160.1 deploy --config wrangler.gps-qa.jsonc
      - name: Verificar HTTP 200 y que producción continúa en versión anterior
        run: |
          set -euo pipefail
          URL='https://via-traslados-gps-precision-qa.marcelof-gx.workers.dev'
          for i in 1 2 3 4 5; do
            code=$(curl -L -sS --max-time 20 -o /tmp/gps-home.html -w '%{http_code}' "$URL/" || true)
            if [ "$code" = 200 ]; then break; fi
            sleep 3
          done
          test "$code" = 200
          grep -F 'reference.js?v=27' /tmp/gps-home.html >/dev/null
          grep -F 'GPS QA' /tmp/gps-home.html >/dev/null
          curl -fsSL "$URL/reference.js?v=27" | grep -F 'watchForBestGpsFix' >/dev/null
          curl -fsSL "$URL/config.js" | grep -F 'via-traslados-maestro-api-qa' >/dev/null
          ! curl -fsSL "$URL/config.js" | grep -F 'via-traslados-api.marcelof-gx.workers.dev'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/requests" -H 'Content-Type: application/json' --data '{}')
          test "$code" = 503
          curl -fsSL https://viatraslados.com/ | grep -F 'reference.js?v=26' >/dev/null
          test "$(curl -fsSL https://viatraslados.com/reference.js | sha256sum | cut -d' ' -f1)" = 'a184e955c0d3d4f13c67f858093ae648cc54a60e218ecd6c6c84ab4d8b46868f'
          echo 'VIA_GPS_PREVIEW_PUBLIC_HTTP_OK_PRODUCTION_UNTOUCHED'
      - name: Probar GPS con Chrome real y geolocalización sintética
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.58.2
          node scripts/via-gps-precision-browser.mjs
      - name: Guardar manifest y paquete de rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-gps-precision-qa-20261119
          path: |
            gps-precision-build/prod-manifest.json
            gps-precision-build/assets/reference.js
            gps-precision-build/assets/geo-v2/core.mjs
          retention-days: 30
          if-no-files-found: warn
