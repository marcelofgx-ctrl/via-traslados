name: Vía Traslados V29.1.16 — guarded visual-only production release
on:
  push:
    branches: [via-ui-date-map-v29116-20261123]
    paths: ["release/VIA_V29116_QA_APPROVED"]
permissions:
  contents: read
  actions: read
concurrency:
  group: via-web-prod-v29116-ui
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require validated QA marker and unchanged Cloudflare V29.1.15 production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -s release/VIA_V29116_QA_APPROVED
          node --check scripts/via-v29116-qa-proof.mjs
          python3 -m py_compile scripts/via-v29116-release.py
          node --check scripts/via-v29116-date-ui.js
          node --check scripts/via-v29116-map-point-picker.js
          python3 -c "import runpy;f=runpy.run_path('scripts/via-v291-prepare.py');assert f['active_version']()=='e7830749-95f0-4a0e-8781-0e2ae6a19466','Unexpected prod Worker; no release'"
      - name: Require successful exact-source 83-case QA proof from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/via-v29116-qa-proof.mjs
      - name: Rebuild web-only assets and compare exact source and functional hashes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-v29116-release.py prepare
      - name: Check isolated QA source and Cloudflare Wrangler prod dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/via-v29116-release.py qa
          npx --yes wrangler@4.160.1 deploy --config mine-v29116-build/wrangler.prod.jsonc --dry-run --keep-vars
      - name: Publish only static web with readback hash verification and rollback if needed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-v29116-release.py release
      - name: Recheck public OTP/CORS, routing, geocoding and signed APK without writes
        run: node tests/prod-core-invariants.mjs
      - name: Keep live asset manifest and exact rollback reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-v29116-prod-asset-hashes-and-rollback
          path: mine-v29116-build/manifest.json
          retention-days: 30
          if-no-files-found: warn
