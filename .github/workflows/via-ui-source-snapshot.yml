name: Via Traslados - snapshot de interfaz activa para rediseño QA
on:
  push:
    branches: [via-premium-flow-qa]
    paths: [".github/workflows/via-ui-source-snapshot.yml"]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guardar únicamente archivos PUBLICOS de la web actual
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          import urllib.request,pathlib,re
          base='https://viatraslados.com/'
          target=pathlib.Path('ui-prod');target.mkdir(exist_ok=True)
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ViaUIAudit/1.0','Accept-Encoding':'identity'}),timeout=20) as r:
              assert r.status==200,(url,r.status)
              return r.read()
          data=get(base)
          (target/'index.html').write_bytes(data)
          class Assets(HTMLParser):
            def __init__(self):super().__init__();self.urls=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='script' and a.get('src'):self.urls.append(a['src'])
              if tag=='link' and a.get('rel')=='stylesheet' and a.get('href'):self.urls.append(a['href'])
          p=Assets();p.feed(data.decode('utf-8','replace'))
          seen=set()
          for ref in p.urls:
            url=urljoin(base,ref)
            if urlparse(url).hostname!='viatraslados.com':continue
            name=urlparse(url).path.rsplit('/',1)[-1]
            if name in seen or not name.endswith(('.js','.css')):continue
            seen.add(name)
            content=get(url)
            assert len(content)<900000,(name,len(content))
            (target/name).write_bytes(content)
            print('SNAPSHOT_PUBLIC',name,len(content))
          assert (target/'app.js').exists() and (target/'premium.css').exists() and (target/'address-autocomplete.js').exists()
          print('SNAPSHOT_SUCCESS: no private API keys, no data, no production changes')
          PY
      - name: Versionar copia publica para revisión QA
        run: |
          git config user.name via-ui-qa-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui-prod/
          git diff --cached --quiet || git commit -m "chore(via-ui): snapshot current public production UI before redesign"
          git push origin HEAD:via-premium-flow-qa
