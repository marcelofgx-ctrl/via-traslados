name: Vía Traslados - diagnosticar vista previa premium sin publicar
on:
  push:
    branches: [via-premium-flow-qa]
    paths: [".github/workflows/via-ui-debug.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar versión preliminar y configuración de assets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          id='9b5369c0-f469-4b77-a6c8-1fd605809104'
          root=f'https://api.cloudflare.com/client/v4/accounts/{os.environ["CF_ACCOUNT_ID"]}/workers/scripts/via-traslados-web-prod/versions/{id}'
          req=urllib.request.Request(root,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
          with urllib.request.urlopen(req,timeout=20) as r:obj=json.load(r)
          value=obj.get('result') or {}
          print('VERSION_KEYS',list(value.keys()))
          print('RESOURCES_KEYS',list((value.get('resources') or {}).keys()))
          v=(value.get('resources') or {})
          print('SCRIPT_RUNTIME',json.dumps(v.get('script_runtime',{}))[:1000])
          print('VERSION_ASSETS',json.dumps(value.get('assets',{}))[:900])
          preview='https://9b5369c0-via-traslados-web-prod.marcelof-gx.workers.dev'
          for path in ['/','/index.html','/__via/booking-premium.css','/__via/booking-premium.js','/api/direcciones?q=Roque%20Saenz%20Pena%201711']:
            req=urllib.request.Request(preview+path,headers={'User-Agent':'ViaPreviewDebug/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read(40000)
                print('URL',path,'STATUS',r.status,'CONTENT_TYPE',r.headers.get('Content-Type'),'BYTES',len(body),'HAS_INJECTED',b'/__via/booking-premium' in body,'FIRST',repr(body[:130]))
            except urllib.error.HTTPError as e:print('URL',path,'STATUS',e.code)
          print('NO_DEPLOYMENT_OR_MUTATION')
          PY
