name: Vía — reverse geographic D1 cache QA
on:
  push:
    branches: [via-v30410-visual-compat-qa-20261125]
    paths: ['.github/workflows/via-reverse-cache-qa.yml']
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify reverse fallback and persistent cache contracts
        run: |
          node tests/via-reverse-fallback.test.mjs
          node tests/via-reverse-cache.test.mjs
      - name: Verify real QA D1 isolated schema and round trip
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-reverse-cache-qa.py
