name: Vía Traslados V29 — control público de APK demo
on:
  push:
    branches: [via-apk-descarga-qa-20261112]
    paths: [".github/workflows/via-v29-public-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Comprobar página general y V29 sin autenticación
        run: |
          set -euo pipefail
          BASE=https://via-conductor-apk-qa.vercel.app
          ok=0
          for i in $(seq 1 15); do
            code=$(curl -sSL --max-time 15 -o /tmp/via-index -w '%{http_code}' "$BASE/" || true)
            if [ "$code" = "200" ] && grep -q 'Descargar V29 Demo' /tmp/via-index; then ok=1;break;fi
            sleep 4
          done
          test "$ok" -eq 1
          curl -fLsS --retry 3 "$BASE/v29-preview/" -o /tmp/via-v29-page
          grep -q 'Socios y cotizaciones' /tmp/via-v29-page
      - name: Comprobar binario APK y SHA256 publicado
        run: |
          set -euo pipefail
          BASE=https://via-conductor-apk-qa.vercel.app
          curl -fLsS --retry 4 --max-time 140 "$BASE/v29-preview/via-conductor-v29-demo.apk" -o /tmp/via-v29.apk
          test "$(stat -c%s /tmp/via-v29.apk)" -gt 1000000
          echo "7bec36b964ebe1ac93e562fc3b2602151b8c825ba244629ca43762d271a1bf83  /tmp/via-v29.apk" | sha256sum -c -
          unzip -t /tmp/via-v29.apk | tail -2
          curl -fLsS --retry 3 "$BASE/v28-preview/SHA256SUMS.txt" | grep -q 'via-conductor-v28-demo.apk'
