name: Via — Auditoría identidad V29.1.3 SOLO LECTURA
on:
  push:
    branches: [via-identity-recognized-qa-20261120]
    paths: ['.github/workflows/via-identity-v2914-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Cloudflare y fuentes públicas reales
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const cf=async name=>{const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/'+name+'/deployments',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('CF '+r.status);const x=await r.json();if(!x.success)throw Error(JSON.stringify(x.errors));const d=x.result.deployments[0];return {deployment:d.id,version:d.versions[0].version_id,pct:d.versions[0].percentage}};
          console.log('IDENTITY_LIVE_VERSIONS',JSON.stringify({web:await cf('via-traslados-web-prod'),api:await cf('via-traslados-api')}));
          const get=async path=>{const r=await fetch('https://viatraslados.com/'+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});if(r.status!==200)throw Error(path+' status '+r.status);const data=Buffer.from(await r.arrayBuffer());console.log('IDENTITY_LIVE_ASSET',JSON.stringify({path,size:data.length,sha:sha(data)}));return data.toString('utf8')};
          const files=['','app.js?v=29.1','store.js?v=19.1','mis-reservas.html','via-v291-home-account.js?v=1','wizard-ux.js?v=29','passkeys.js?v=21'];
          const texts={};
          for(const p of files)texts[p]=await get(p);
          for(const [file,s] of Object.entries(texts)){
            const lines=s.split('\n');
            const hits=[];
            const re=/Cuenta reconocida|Cuenta verificada|Continuar con mi celular|paso dos|paso 2|PASO DOS|identity|identidad|recognized|recogniz|verified|sessionToken|ViaStore\.customer|customer\/me|\.resume\(|customer-session|name|email|phone|step2|step 2|step-2|step===2/i;
            for(let i=0;i<lines.length;i++)if(re.test(lines[i]))hits.push(i);
            const selected=new Set();for(const i of hits)for(let j=Math.max(0,i-3);j<=Math.min(lines.length-1,i+4);j++)selected.add(j);
            const output=[...selected].sort((a,b)=>a-b).map(i=>(i+1)+': '+lines[i]).join('\n');
            console.log('IDENTITY_SOURCE '+file+' total='+lines.length+' hits='+hits.length+'\n'+output.slice(0,file==='app.js?v=29.1'?34000:15000)+'\nIDENTITY_SOURCE_END');
          }
          const html=texts[''];
          console.log('IDENTITY_HTML_MARKERS',JSON.stringify({v2913:html.includes('content="29.1.3"'),gps29:html.includes('reference.js?v=29'),app:html.includes('app.js?v=29.1'),store:html.includes('store.js?v=19.1')}));
          NODE

      - name: Fuente exacta del wizard, DOM y store para parche mínimo
        run: |
          node --input-type=module <<'NODE'
          const grab=async name=>{const r=await fetch('https://viatraslados.com/'+name,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error(name+' '+r.status);return (await r.text()).split('\n')};
          const app=await grab('app.js?v=29.1');
          const home=await grab('');
          const store=await grab('store.js?v=19.1');
          const css=await grab('wizard-ux.css?v=12');
          const show=(label,lines,a,b)=>console.log('IDENTITY_DETAIL '+label+' '+a+'-'+b+'\n'+lines.slice(a-1,b).map((s,i)=>String(i+a).padStart(4)+': '+s).join('\n')+'\nIDENTITY_DETAIL_END');
          show('APP',app,1,200);
          show('APP',app,275,375);
          show('HTML',home,66,130);
          show('STORE',store,1,102);
          show('CSS',css,1,65);
          NODE
