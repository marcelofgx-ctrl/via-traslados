name: Via Traslados - auditar versiones activas (solo lectura)
on:
  push:
    branches: [main]
    paths: [".github/workflows/via-deployment-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Comparar web principal, Pages, buscadores y Workers sin modificar nada
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PAGES_TOKEN: ${{ secrets.VIA_PAGES_DEPLOY_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json,hashlib,re,os
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          class Scripts(HTMLParser):
            def __init__(self):super().__init__();self.urls=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script':
                src=dict(attrs).get('src')
                if src:self.urls.append(src)
          def fetch(url,token=None):
            headers={'User-Agent':'ViaReadOnlyAudit/1.0','Accept-Encoding':'identity'}
            if token:headers['Authorization']='Bearer '+token
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=14) as r:
                data=r.read(1600000);return r.status,data.decode('utf-8','replace'),dict(r.headers)
            except urllib.error.HTTPError as e:return e.code,'',{}
            except Exception as e:return 'ERR:'+str(type(e).__name__),'',{}
          def digest(s):return hashlib.sha256(s.encode('utf-8')).hexdigest()[:16]
          def flags(s):
            s=s.lower();return {k:k in s for k in ['shangril','lagomar','roque','saenz','direcciones','geocode','nominatim','openstreetmap','api/direcciones','correctlocality','correctknownportal']}
          def result(url):
            status,body,headers=fetch(url);out={'status':status}
            if status==200:
              try:
                obj=json.loads(body)
                if isinstance(obj,dict):
                  out['keys']=list(obj.keys())[:10]
                  out['results']=[{k:x.get(k) for k in ['label','street','city','department','accuracy','kind'] if k in x} for x in obj.get('results',[])[:6] if isinstance(x,dict)]
                  if 'error' in obj:out['error']=str(obj['error'])[:90]
              except:out['sha']=digest(body)
            return out
          for name in ['viatraslados.com','via-traslados-pasajeros.pages.dev']:
            base='https://'+name
            print('\nSITE',name)
            status,body,headers=fetch(base+'/')
            print('ROOT',status,'sha',digest(body),'bytes',len(body),'flags',json.dumps(flags(body)))
            if status!=200:continue
            parser=Scripts();parser.feed(body)
            for src in parser.urls[:30]:
              link=urljoin(base+'/',src)
              if urlparse(link).netloc!=name:continue
              code,b,head=fetch(link)
              print('ASSET',src,'http',code,'sha',digest(b),'bytes',len(b),'flags',json.dumps(flags(b)))
              if code==200 and '.js' in src:
                found=sorted(set(re.findall(r'/api/[a-zA-Z0-9/_-]+',b)))[:25]
                if found:print('API_PATHS',src,','.join(found))
            for mode in ['suggest','resolve']:
              url=base+'/api/direcciones?'+urllib.parse.urlencode({'mode':mode,'q':'Roque Sáenz Peña 1711'})
              print('GEOCODE',mode,json.dumps(result(url),ensure_ascii=False))
          backend='https://via-traslados-api.marcelof-gx.workers.dev'
          print('\nBACKEND_HEALTH',json.dumps(result(backend+'/api/health'),ensure_ascii=False))
          for origin in ['https://viatraslados.com','https://via-traslados-pasajeros.pages.dev']:
            req=urllib.request.Request(backend+'/api/auth/start',method='OPTIONS',headers={'Origin':origin,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'Content-Type'})
            try:
              with urllib.request.urlopen(req,timeout=12) as r: print('PREFLIGHT',origin,r.status,r.headers.get('Access-Control-Allow-Origin'))
            except Exception as e:print('PREFLIGHT_ERROR',origin,type(e).__name__)
          account=os.environ.get('CF_ACCOUNT_ID','')
          if re.fullmatch(r'[a-f0-9]{32}',account,re.I):
            api='https://api.cloudflare.com/client/v4/accounts/'+account
            for name in ['via-traslados-web-prod','via-traslados-api','traslados-web']:
              token=os.environ.get('CF_WORKER_TOKEN','')
              if not token:continue
              status,body,headers=fetch(api+'/workers/scripts/'+name,token)
              print('WORKER_SOURCE',name,'http',status,'sha',digest(body),'bytes',len(body),'flags',json.dumps(flags(body)))
            for name in ['via-traslados-pasajeros','via-traslados-web-prod']:
              token=os.environ.get('CF_PAGES_TOKEN','')
              if not token:continue
              status,body,headers=fetch(api+'/pages/projects/'+name,token)
              data={'http':status}
              if status==200:
                try:
                  v=json.loads(body).get('result') or {}
                  data.update({'name':v.get('name'),'subdomain':v.get('subdomain'),'production_branch':v.get('production_branch'),'domains':v.get('domains',[])[:8],'latest_deployment':{k:(v.get('latest_deployment') or {}).get(k) for k in ['id','created_on','url']}})
                except:pass
              print('PAGES_PROJECT',name,json.dumps(data))
          else:print('CF_ACCOUNT_ID invalid or missing')
          # Inspect structural portions only; never print secrets, raw tokens, account IDs or full code.
          for name in ['via-traslados-web-prod']:
            token=os.environ.get('CF_WORKER_TOKEN','')
            if not token or not re.fullmatch(r'[a-f0-9]{32}',account,re.I):continue
            status,source,headers=fetch(api+'/workers/scripts/'+name,token)
            print('WORKER_INSPECT',name,'status',status,'len',len(source))
            if status==200:
              print('WORKER_PREFIX',repr(source[:300]))
              delim='name="_worker.js"\r\n\r\n'
              if delim in source:
                js=source.split(delim,1)[1].split('\r\n--',1)[0]
                li=js.splitlines()
                print('WORKER_JS_COUNT',len(li))
                for j in range(max(0,len(li)-43),len(li)):
                  safe=li[j][:600]
                  if re.search(r'(?i)(api[_-]?key|secret|token|password|bearer|pepper)\s*[:=]',safe):safe='[sensitive line omitted]'
                  print('WORKER_TAIL',j+1,repr(safe))
              if "Content-Type: application/javascript+module" in source:
                component=source.split("Content-Type: application/javascript+module",1)[1]
                component=component.split("\r\n\r\n",1)[1].split("\r\n--",1)[0]
                print('WORKER_SCRIPT_LINES',len(component.splitlines()))
                for j,line in enumerate(component.splitlines()):
                  if j < 18 or 93<=j<=148:
                    safe=line[:400]
                    if re.search(r'(?i)(api[_-]?key|secret|token|password|bearer|pepper)\s*[:=]',safe):safe='[sensitive line omitted]'
                    print('SCRIPT_LINE',j+1,repr(safe))

              lines=source.splitlines()
              needles=('api/direcciones','lagomar','function normalized','function normalize','mode===','mode ===','env.ASSETS','env.ASSET','handleRequest','export default','fetch(request','localidad','suggest','resolve')
              found=[i for i,l in enumerate(lines) if any(q.lower() in l.lower() for q in needles)]
              printed=set()
              for i in found[:35]:
                for j in range(max(0,i-1),min(len(lines),i+2)):
                  if j in printed:continue
                  printed.add(j)
                  v=lines[j][:320]
                  if re.search(r'(?i)(api[_-]?key|secret|token|password|bearer|pepper)\s*[:=]',v):v='[sensitive line omitted]'
                  print('WORKER_LINE',j+1,repr(v))
              status,settings,headers=fetch(api+'/workers/scripts/'+name+'/settings',token)
              print('WORKER_SETTINGS',status)
              if status==200:
                try:
                  obj=json.loads(settings).get('result') or {}
                  print('WORKER_BINDINGS',[(b.get('name'),b.get('type')) for b in obj.get('bindings',[])])
                except: pass
          for name in ['viatraslados.com','via-traslados-pasajeros.pages.dev']:
            status,s,h=fetch('https://'+name+'/address-autocomplete.js')
            print('SEARCH_CLIENT',name,status,'lines',len(s.splitlines()))
            if status==200:
              lines=s.splitlines()
              for i,l in enumerate(lines):
                if any(n in l.lower() for n in ['function correct','function search','function display','mode=resolve','mode=suggest','source.value','fetch(']):
                  safe=l[:270]
                  if re.search(r'(?i)(api[_-]?key|secret|token|password|bearer|pepper)\s*[:=]',safe):safe='[sensitive line omitted]'
                  print('CLIENT_LINE',name,i+1,repr(safe))
          preview='https://37bf21a4-via-traslados-web-prod.marcelof-gx.workers.dev'
          for url in ['https://viatraslados.com/',preview+'/',preview+'/api/direcciones?mode=suggest&q=Roque%20S%C3%A1enz%20Pe%C3%B1a%201711',preview+'/api/direcciones?mode=resolve&q=Roque%20S%C3%A1enz%20Pe%C3%B1a%201711%2C%20Shangril%C3%A1%2C%20Canelones']:
            status,body,headers=fetch(url)
            print('VERSION_PROBE',url,'HTTP',status,'TYPE',headers.get('Content-Type'),'LEN',len(body),'SHA',digest(body),'PREFIX',repr(body[:250]))
            if '/api/direcciones?' in url and status==200:
              try:
                parsed=json.loads(body)
                print('VERSION_RESULT',json.dumps([{k:v.get(k) for k in ('label','city','department','accuracy')} for v in parsed.get('results',[])[:5]],ensure_ascii=False))
              except:pass
          import difflib
          for route in ['/','/app.js','/address-autocomplete.js','/store.js','/reference.js','/sw.js','/config.js','/premium.css']:
            prod='https://viatraslados.com'+route
            stage=preview+route
            a_status,a_body,_=fetch(prod)
            b_status,b_body,_=fetch(stage)
            print('ASSET_COMPARE',route,'prod',a_status,len(a_body),digest(a_body),'stage',b_status,len(b_body),digest(b_body),'equal',a_body==b_body)
            if route=='/' and a_status==b_status==200 and a_body!=b_body:
              a_lines=a_body.replace('><','>\n<').splitlines()
              b_lines=b_body.replace('><','>\n<').splitlines()
              chunks=list(difflib.unified_diff(a_lines,b_lines,fromfile='production',tofile='preview',n=1))[:40]
              print('DIFF_SAMPLE','\n'.join(c[:250] for c in chunks))
          print('READ_ONLY_AUDIT_COMPLETE: no database queries, no mutations, no emails, no bookings')
          PY
