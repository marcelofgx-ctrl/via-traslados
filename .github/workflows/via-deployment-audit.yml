name: Via Traslados - controlar buscador y despliegues diariamente
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/via-deployment-audit.yml"]
permissions:
  contents: read
jobs:
  public_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar únicamente recursos públicos de Vía Traslados
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json,unicodedata,os
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'ViaPublicReadOnlyRegression/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=24) as r:
              assert r.status==200,(url,r.status)
              return r.read()
          def clean(s):
            return ''.join(c for c in unicodedata.normalize('NFD',str(s).lower()) if not unicodedata.combining(c))
          def check(site):
            base='https://'+site
            assert b'Via Traslados' in get(base+'/').replace('Vía'.encode(),b'Via'), 'Portada no disponible'
            def rows(mode,q):
              url=base+'/api/direcciones?'+urllib.parse.urlencode({'mode':mode,'q':q})
              data=json.loads(get(url));assert isinstance(data.get('results'),list)
              return data['results']
            chosen=rows('resolve','Roque Sáenz Peña 1711, Shangrilá, Canelones')
            assert chosen,'El motor no devuelve el portal'
            first=chosen[0]
            assert 'shangrila' in clean(first.get('city')) and 'canelones' in clean(first.get('department')),f'Localidad de portal incorrecta en {site}: {first.get("city")}'
            suggested=rows('suggest','Roque Sáenz Peña 1711')
            assert any('shangrila' in clean(x.get('city')) and 'canelones' in clean(x.get('department')) for x in suggested),'No aparece Shangrilá entre sugerencias'
            airport=rows('places','Aeropuerto Carrasco')
            assert any('aeropuerto internacional de carrasco' in clean(x.get('street')) for x in airport),'Aeropuerto Carrasco no disponible'
            print('WEB_CHECK_OK',site,'portal',first.get('city'),'airport',len(airport))
          for site in ['viatraslados.com','via-traslados-pasajeros.pages.dev']:check(site)
          try:
            health=json.loads(get('https://via-traslados-api.marcelof-gx.workers.dev/api/health'))
            assert health.get('ok') is True and health.get('otpAvailable') is True,'Backend de Vía Traslados no está preparado para OTP'
          except urllib.error.HTTPError as error:
            if error.code!=403:raise
            # El health GET puede estar protegido; validar la API pública mediante preflight autenticado por Origin.
            pre=urllib.request.Request('https://via-traslados-api.marcelof-gx.workers.dev/api/auth/start',
              method='OPTIONS',headers={'Origin':'https://viatraslados.com','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'Content-Type'})
            with urllib.request.urlopen(pre,timeout=24) as response:
              assert response.status==204 and response.headers.get('Access-Control-Allow-Origin')=='https://viatraslados.com'
            print('BACKEND_CORS_PRECHECK_OK; health GET restringido')
          html=get('https://viatraslados.com/').decode('utf-8','replace')
          follow=get('https://viatraslados.com/reserva.html').decode('utf-8','replace')
          style=get('https://viatraslados.com/review-compact-v29.css').decode('utf-8','replace')
          booking_style=get('https://viatraslados.com/via-status-premium.css').decode('utf-8','replace')
          assert 'app.js?v=29' in html and 'review-compact-v29.css?v=29' in html,'La V29 de pasajeros no está publicada'
          assert 'via-status-premium.css?v=24' in follow,'El seguimiento V24+ no está publicado'
          assert 'Vía Traslados V29' in style and 'body[data-page="booking"] .status-card' in booking_style,'Faltan estilos V29 o de seguimiento'
          print('VISUAL_V29_DEPLOYMENT_VERIFIED: home, wizard, tracking V24')
          sw=get('https://viatraslados.com/sw.js').decode('utf-8','replace')
          assert "url.pathname.includes('/api/')" in sw or "url.pathname.startsWith('/api/')" in sw,'La caché del navegador debe excluir las API'
          print('BACKEND_AND_CACHE_OK - sin consultar base de datos, sin crear reservas ni enviar correos')
          path=os.environ.get('GITHUB_STEP_SUMMARY')
          if path:
            with open(path,'a') as out:
              out.write('## Vía Traslados — prueba diaria sin modificaciones\n\n')
              out.write('- Web principal y Pages: geocodificación de Shangrilá correcta\n')
              out.write('- Aeropuerto Carrasco: disponible en ambos buscadores\n')
              out.write('- Backend: comprobación de health o preflight CORS validada\n')
              out.write('- Diseño premium: portada, formulario y seguimiento presentes\n')
              out.write('- Service Worker: no guarda respuestas API en caché\n')
              out.write('- Reservas, bases de datos, DNS y otros proyectos: sin cambios\n')
          PY

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar versión efectiva y respaldo D1 sin escrituras
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/via-production-release-readonly.mjs
      - name: Guardar manifiesto reproducible sin datos privados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-production-release-readonly-manifest
          path: via-production-release-manifest.json
          if-no-files-found: warn
          retention-days: 30
