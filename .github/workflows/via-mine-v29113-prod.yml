name: Vía Traslados V29.1.13 - guarded CSS-only Inicio production and v29.1.12 rollback
on:
  push:
    branches: [via-mine-v29113-inicio-no-clip-20261122]
    paths: ["release/VIA_V29113_QA_APPROVED"]
permissions:
  contents: read
concurrency:
  group: via-web-prod-v29113-inicio-approved
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require QA gate and fresh v29.1.12 Cloudflare baseline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -s release/VIA_V29113_QA_APPROVED
          python3 -m py_compile scripts/via-mine-v29113-release.py
          python3 scripts/via-mine-v29113-audit.py
      - name: Reconstruct ONLY active web static assets and original Worker from live production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-mine-v29113-release.py prepare
      - name: Preflight isolated QA and production Wrangler dry-run, no API/D1 operations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/via-mine-v29113-release.py qa
          npx --yes wrangler@4.160.1 deploy --config mine-v29113-build/wrangler.prod.jsonc --dry-run --keep-vars
      - name: Release limited web-only CSS with live hash/Worker guard and automatic V29.1.12 rollback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-mine-v29113-release.py release
      - name: Recheck OTP/CORS, routes, geocoder, signed APK without making bookings
        run: node tests/prod-core-invariants.mjs
      - name: Preserve web-only release manifest and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-v29113-inicio-production-manifest-rollback
          path: mine-v29113-build/manifest.json
          if-no-files-found: warn
          retention-days: 30
