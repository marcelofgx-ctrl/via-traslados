name: Via Traslados - probar formulario premium sin tocar produccion
on:
  push:
    branches: [via-premium-flow-qa]
    paths:
      - "ui-prod/flow-premium.css"
      - "ui-prod/flow-premium.js"
      - ".github/workflows/via-ui-premium-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar código visual (sin acceso a reservas)
        run: |
          node --check ui-prod/flow-premium.js
          test -s ui-prod/flow-premium.css
          ! grep -E "fetch\(|localStorage|indexedDB|serviceWorker.register|API_KEY|CLOUDFLARE_" ui-prod/flow-premium.js
      - name: Crear version QA de Worker preservando ASSETS, backend, diseño original y geocodificador
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re,json,uuid,pathlib,urllib.request,urllib.error,hashlib
          a=os.environ['CF_ACCOUNT_ID'];t=os.environ['CF_TOKEN']
          assert re.fullmatch(r'[a-f0-9]{32}',a,re.I)
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/via-traslados-web-prod'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+t,'Accept-Encoding':'identity'})
          with urllib.request.urlopen(req,timeout=25) as response:
            raw=response.read()
            boundary=re.search(r'boundary="?([^";]+)',response.headers.get('Content-Type',''))
          assert boundary,'El Worker debe enviarse en multipart'
          parts=raw.split(b'--'+boundary.group(1).encode())
          print('CLOUDFLARE_SCRIPT_PARTS',len(parts),'CT',response.headers.get('Content-Type',''))
          for ix,part in enumerate(parts):
            head=part.split(b'\\r\\n\\r\\n',1)[0]
            print('CF_PART',ix,repr(head[:250]),'LEN',len(part))
          module=None
          for part in parts:
            if b'Content-Disposition: form-data; name=' in part and b'\r\n\r\n' in part:
              header,part_body=part.split(b'\r\n\r\n',1)
              if b'.mjs"' in header or b'.js"' in header or b'name="_worker.js"' in header:
                module=part_body.rstrip(b'\r\n').decode('utf-8');break
          assert module,'No se halló el módulo del Worker'
          assert 'env.ASSETS.fetch(request)' in module
          assert 'correctKnownPortal' in module or 'Shangrilá' in module
          if 'const VIA_BOOKING_CSS = ' in module:
            source=module.split('const VIA_BOOKING_CSS = ',1)[0]
            assert 'function directions' in source and 'function isClosed' in source and 'env.ASSETS.fetch(request)' in module
            base_fetch='const response = (isPublicPage(request,path) && await isClosed()) ? maintenance() : (path === "/api/direcciones" ? await directions(request) : await env.ASSETS.fetch(request));'
          elif 'worker_default as default' in module:
            pos=module.rfind('export {')
            source=module[:pos]
            base_fetch='const response = await worker_default.fetch(request,env,ctx);'
          else:
            assert 'export default' in module and 'isPublicPage' in module and 'isClosed' in module and 'function directions' in module
            pos=module.rfind('export default')
            source=module[:pos]
            base_fetch='const response = (isPublicPage(request,path) && await isClosed()) ? maintenance() : (path === "/api/direcciones" ? await directions(request) : await env.ASSETS.fetch(request));'

          css=pathlib.Path('ui-prod/flow-premium.css').read_text()
          js=pathlib.Path('ui-prod/flow-premium.js').read_text()
          shell="""
          const VIA_BOOKING_CSS = __CSS__;
          const VIA_BOOKING_JS = __JS__;
          const viaUIHeaders = (type) => ({
            "content-type": type,
            "cache-control": "public, max-age=300",
            "x-content-type-options": "nosniff"
          });
          export default {
            async fetch(request,env,ctx) {
              const path = new URL(request.url).pathname;
              if(path === "/__via/booking-premium.js") return new Response(VIA_BOOKING_JS,{headers:viaUIHeaders("application/javascript; charset=utf-8")});
              if(path === "/__via/booking-premium.css" && new URL(request.url).searchParams.get("preview") === "1"){
                const response = await env.ASSETS.fetch(new Request(new URL("/index.html",request.url),request));
                if(!response.ok) return response;
                const pageHTML = await response.text();
                const replacement = pageHTML
                  .replace("</head>",'<base href="/"><link rel="stylesheet" href="/__via/booking-premium.css?v=1"></head>')
                  .replace("</body>",'<script src="/__via/booking-premium.js?v=1"></script></body>');
                return new Response(replacement,{headers:{"content-type":"text/html; charset=utf-8","cache-control":"no-store","x-via-premium-preview":"yes"}});
              }
              if(path === "/__via/booking-premium.css") return new Response(VIA_BOOKING_CSS,{headers:viaUIHeaders("text/css; charset=utf-8")});
              __BASE_FETCH__
              if((path !== "/" && path !== "/index.html") || response.status !== 200 || request.method !== "GET")return response;
              if(!String(response.headers.get("content-type")||"").includes("text/html"))return response;
              return new HTMLRewriter()
                .on("head",{element(el){el.append('<link rel="stylesheet" href="/__via/booking-premium.css?v=1">',{html:true})}})
                .on("body",{element(el){el.append('<script src="/__via/booking-premium.js?v=1"></script>',{html:true})}})
                .transform(response);
            }
          };
          """
          shell=shell.replace('__CSS__',json.dumps(css,ensure_ascii=False)).replace('__JS__',json.dumps(js,ensure_ascii=False)).replace('__BASE_FETCH__',base_fetch)
          combined=source+'\n'+shell
          pathlib.Path('/tmp/via-premium-stage.mjs').write_text(combined)
          print('SOURCE_SHA',hashlib.sha256(module.encode()).hexdigest()[:16],'UI_CSS_LENGTH',len(css),'UI_JS_LENGTH',len(js))
          meta={'main_module':'via-premium-stage.mjs','keep_assets':True,
            'bindings':[{'type':'assets','name':'ASSETS'}],
            'assets':{'config':{'run_worker_first':['/','/index.html']}},
            'compatibility_date':'2026-11-10',
            'annotations':{'workers/message':'Solo presentación premium de reserva; versión QA sin tráfico'}}
          boundary='ViaUI'+uuid.uuid4().hex
          body=(('--'+boundary+'\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n').encode()+json.dumps(meta).encode()+b'\r\n'
            +('--'+boundary+'\r\nContent-Disposition: form-data; name="via-premium-stage.mjs"; filename="via-premium-stage.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+combined.encode()+b'\r\n'
            +('--'+boundary+'--\r\n').encode())
          v=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/via-traslados-web-prod/versions'
          req=urllib.request.Request(v,data=body,method='POST',headers={'Authorization':'Bearer '+t,'Content-Type':'multipart/form-data; boundary='+boundary,'Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=40) as response:out=json.load(response)
          except urllib.error.HTTPError as error:
            print('CLOUDFLARE_ERROR',error.code,error.read().decode('utf-8','replace')[:600]);raise
          assert out.get('success'),out.get('errors')
          version=out.get('result') or {}
          vid=version.get('id');assert vid
          preview='https://'+vid.split('-')[0]+'-via-traslados-web-prod.marcelof-gx.workers.dev'
          pathlib.Path('/tmp/via-premium-url').write_text(preview)
          pathlib.Path('/tmp/via-premium-version').write_text(vid)
          print('QA_PREVIEW_URL',preview)
          print('VERSION_CREATED_NOT_DEPLOYED',vid)
          PY
      - name: Verificar recursos públicos, geocodificador y estilos de la versión de prueba
        run: |
          python3 - <<'PY'
          import pathlib,urllib.request,json,urllib.parse
          site=pathlib.Path('/tmp/via-premium-url').read_text()
          def get(path):
            req=urllib.request.Request(site+path,headers={'User-Agent':'ViaUIQA/1.0'})
            with urllib.request.urlopen(req,timeout=22) as response:
              assert response.status==200,(path,response.status)
              body=response.read().decode('utf-8','replace')
              print('PREVIEW_RESPONSE',path,'CT',response.headers.get('Content-Type'),'X-Preview',response.headers.get('X-Via-Premium-Preview'),'bytes',len(body),'start',repr(body[:95]))
              return body
          html=get('/__via/booking-premium.css?preview=1')
          assert '/__via/booking-premium.css' in html
          assert '/__via/booking-premium.js' in html
          assert '¿A dónde vamos?' in html and 'map-stage' in html and 'solicitar' in html
          css=get('/__via/booking-premium.css')
          js=get('/__via/booking-premium.js')
          assert 'body.premium-page.in-booking' in css and 'via-address-view' in css
          assert 'Confirmá tu recorrido' in js
          check='/api/direcciones?'+urllib.parse.urlencode({'mode':'resolve','q':'Roque Sáenz Peña 1711, Shangrilá, Canelones'})
          rows=json.loads(get(check)).get('results') or []
          assert rows and 'shangril' in str(rows[0].get('city')).lower()
          print('PREVIEW_RESOURCES_OK')
          print('PREVIEW_GEOCODER_OK',rows[0].get('city'))
          PY
      - name: Instalar navegador para evaluar el diseño real en móvil y escritorio
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Probar flujo visual sin registrar ni enviar reservas
        run: |
          cat > /tmp/check-via-ui.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const url=fs.readFileSync('/tmp/via-premium-url','utf8').trim();
            for (const [width,height] of [[390,844],[360,740],[320,640],[1280,820]]) {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1,isMobile:width<700,hasTouch:width<700});
              page.on('dialog',d=>d.dismiss());
              await page.goto(url+'/__via/booking-premium.css?preview=1',{waitUntil:'domcontentloaded',timeout:35000});
              await page.locator('#home-origin').fill('Avenida Italia 5785, Montevideo');
              await page.locator('#home-destination').fill('Aeropuerto Internacional de Carrasco');
              await page.locator('#start-booking').click();
              await page.waitForTimeout(700);
              const metrics=await page.evaluate(()=>{
                const q=s=>document.querySelector(s),rect=s=>q(s)?.getBoundingClientRect();
                const wizard=rect('#solicitar'),continueBtn=rect('#to-contact'),map=getComputedStyle(q('.map-stage')).display,
                 value=q('#origin').value,view=q('#origin').closest('.route-field').querySelector('.via-address-view');
                return {
                  mode:document.body.classList.contains('in-booking'),
                  map,headline:q('#booking-heading').textContent,
                  originValue:value,originDisplayed:view?.textContent,
                  notesCollapsed:!q('.via-notes').open,
                  screenWidth:innerWidth,bodyWidth:document.documentElement.scrollWidth,
                  ctaBottom:continueBtn?.bottom,viewportHeight:innerHeight,
                  wizardTop:wizard?.top,wizardBottom:wizard?.bottom,
                  styleLoaded:!![...document.styleSheets].find(x=>x.href?.includes('booking-premium.css'))
                };
              });
              console.log('VIEWPORT',width,height,JSON.stringify(metrics));
              if(!metrics.mode||metrics.map!=='none'||!metrics.styleLoaded||metrics.bodyWidth>width+1||metrics.headline!=='Confirmá tu recorrido'||!metrics.originDisplayed.includes('Avenida Italia')||!metrics.notesCollapsed)throw Error('UI validation failed at '+width);
              if(metrics.ctaBottom>height+2)throw Error('CTA not visible at '+width+'x'+height);
              if(width===390) {
                await page.locator('.via-address-view').first().click();
                if(!(await page.locator('#origin').isVisible()))throw Error('Address edit does not open');
                await page.locator('#origin').fill('Bulevar Artigas 1000, Montevideo');
                await page.locator('#origin').blur();
                await page.waitForTimeout(200);
                if(!(await page.locator('.via-address-view').first().textContent()).includes('Bulevar Artigas'))throw Error('Address view not refreshed');
                await page.locator('#to-contact').click();
                await page.waitForTimeout(200);
                const step2=await page.locator('.wizard-step[data-step="2"]').isVisible();
                if(!step2)throw Error('Step 2 failed');
                await page.locator('#wizard-back').click();
                if(!(await page.locator('.wizard-step[data-step="1"]').isVisible()))throw Error('Back navigation failed');
              }
              await page.screenshot({path:'/tmp/via-visual-'+width+'.png',fullPage:false});
              await page.close();
            }
            await browser.close();
            console.log('ALL_UI_VIEWPORTS_PASSED: no bookings, emails or user data modified');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/check-via-ui.cjs
