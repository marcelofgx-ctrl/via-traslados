name: Vía Traslados V29.1.16 - independent iOS WebKit date and map visuals
on:
  push:
    branches: [via-ui-date-map-v29116-20261123]
    paths: [".github/workflows/via-v29116-webkit-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-webkit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test JavaScript libraries only, no browser system package bootstrap
        run: npm install --no-audit --no-fund --no-save playwright@1.56.1 leaflet@1.9.4
      - name: Test four iPhone widths native date full four-digit year and original date picker
        run: node scripts/via-v29116-date-qa-ios.mjs
      - name: Test map precision, geocoding, two text rows, and coordinate confirmation on real WebKit
        run: node scripts/via-v29116-map-qa-ios.mjs
      - name: Evidence of iOS date and map screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-v29116-ios-date-map-confirmation
          path: |
            via-v29116-date-proof/
            via-v29116-map-proof/
          retention-days: 30
          if-no-files-found: warn
