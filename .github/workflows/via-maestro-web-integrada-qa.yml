name: Vía Maestra — web V29 QA aislada con motor y assets preservados
on:
  push:
    branches: [via-maestro-integracion-real-qa-20261118]
    paths:
      - "scripts/maestro-web-qa-prepare.py"
      - "scripts/maestro-web-worker-bootstrap.mjs"
      - "scripts/via-v29-store-idempotency-qa.mjs"
      - "scripts/maestro-mine-logout-qa-patch.mjs"
      - "tests/via-store-idempotency-qa.test.mjs"
      - ".github/workflows/via-maestro-web-integrada-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: via-maestro-web-qa-only
  cancel-in-progress: false
jobs:
  web-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validar sintaxis y comprobar que no hay comandos a producción
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/maestro-web-qa-prepare.py
          node --check scripts/maestro-web-worker-bootstrap.mjs
          node --check scripts/via-v29-store-idempotency-qa.mjs
          test "$(grep -Ec '^[[:space:]]*npx .*wrangler.*deploy --config wrangler.toml' .github/workflows/via-maestro-web-integrada-qa.yml || true)" -eq 0
      - name: Comprobar API MAESTRO aislada y versión original de producción
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://via-traslados-maestro-api-qa.marcelof-gx.workers.dev/api/health' -o /tmp/maestro-qa-api-before.json
          node -e "let d=require('/tmp/maestro-qa-api-before.json');if(!d.ok||!d.qa||d.production!==false||d.bookings<5)process.exit(1)"
          curl -fLsS --retry 3 'https://viatraslados.com/' -o /tmp/maestro-prod-web-before.html
          grep -F 'store.js?v=19' /tmp/maestro-prod-web-before.html >/dev/null
          grep -F 'app.js?v=29' /tmp/maestro-prod-web-before.html >/dev/null
      - name: Construir store.js desde bytes V19 publicados y ejecutar 4 pruebas
        run: |
          set -euo pipefail
          node scripts/via-v29-store-idempotency-qa.mjs
          node --check dist/via-store-v29-idempotencia-qa.js
          node --test tests/via-store-idempotency-qa.test.mjs
          node scripts/maestro-mine-logout-qa-patch.mjs
          node --check dist/via-mine-app-qa.js
          grep -F 'mine-identity-choice' dist/via-mine-html-qa.html >/dev/null
          grep -F 'display:none !important' dist/via-mine-css-qa.css >/dev/null
      - name: Recuperar SOLO APK V36 QA previamente compilada y verificar hash
        uses: actions/download-artifact@v4
        with:
          name: via-maestro-apk-v36-qa-privada
          run-id: 44393242088
          github-token: ${{ github.token }}
          path: qa-apk-file
      - name: Validar integridad de APK V36 QA sin firmar ni reproducir V35
        run: |
          set -euo pipefail
          test -s qa-apk-file/via-traslados-conductor-maestro-qa-v36.apk
          (cd qa-apk-file && sha256sum -c SHA256SUMS-MAESTRO.txt)
          unzip -t qa-apk-file/via-traslados-conductor-maestro-qa-v36.apk | tail -2
      - name: Copiar exclusivamente assets públicos actuales y Worker geográfico protegido a QA
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/maestro-web-qa-prepare.py prepare
          test -s maestro-web-qa-build/assets/index.html
          test -s maestro-web-qa-build/assets/geo-v2/core.mjs
          test -s maestro-web-qa-build/worker.mjs
          grep -Fx 'name' /dev/null >/dev/null || true
      - name: Verificar build Cloudflare sin publicar
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.160.1 deploy --config maestro-web-qa-build/wrangler.maestro-web.jsonc --dry-run
      - name: Registrar Worker NUEVO exclusivo de web MAESTRO QA
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/maestro-web-worker-bootstrap.mjs
      - name: Publicar únicamente web QA; nunca dominio principal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 deploy --config maestro-web-qa-build/wrangler.maestro-web.jsonc
          ok=0
          for n in $(seq 1 15); do
            if python3 scripts/maestro-web-qa-prepare.py verify; then ok=1;break; fi
            sleep 4
          done
          test "$ok" -eq 1
      - name: Verificar descarga APK de MAESTRO QA byte por byte desde URL pública
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://via-traslados-maestro-web-qa.marcelof-gx.workers.dev/descargas/via-traslados-conductor-maestro-qa-v36.apk' -o /tmp/via-maestro-qa-downloaded.apk
          cmp /tmp/via-maestro-qa-downloaded.apk qa-apk-file/via-traslados-conductor-maestro-qa-v36.apk
          echo 'MAESTRO_APK_QA_PUBLIC_DOWNLOAD_VERIFIED'
      - name: Probar que producción y QA anterior no fueron modificadas
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://via-traslados-api.marcelof-gx.workers.dev/api/health' -o /tmp/maestro-prod-api.json
          curl -fLsS --retry 3 'https://via-traslados-api-qa.marcelof-gx.workers.dev/api/health' -o /tmp/maestro-v34-api.json
          node -e "let p=require('/tmp/maestro-prod-api.json'),q=require('/tmp/maestro-v34-api.json');if(!p.ok||!q.ok||!q.qa)process.exit(1)"
          curl -fLsS --retry 3 'https://viatraslados.com/' -o /tmp/maestro-prod-web-after.html
          cmp /tmp/maestro-prod-web-before.html /tmp/maestro-prod-web-after.html
          echo 'WEB_QA_PUBLICADA_PROD_Y_V34_INTACTAS'
      - name: Guardar manifiesto, fuente original y hashes sin datos personales
        uses: actions/upload-artifact@v4
        with:
          name: via-maestro-web-qa-manifest-privado
          path: |
            maestro-web-qa-build/manifest.json
            maestro-web-qa-build/wrangler.maestro-web.jsonc
          retention-days: 14
          if-no-files-found: error
