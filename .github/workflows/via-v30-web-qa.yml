name: Vía Traslados V30 — passenger web and map flow mobile QA
on:
  push:
    branches: [via-v30-mvp-operativo-20261123]
    paths:
      - ".github/workflows/via-v30-web-qa.yml"
      - "scripts/v30-web-app.js"
      - "scripts/v30-web-store.js"
      - "scripts/v30-web-release.py"
      - "scripts/v30-web-route-qa.mjs"
      - "scripts/v30-web-flow-regressions.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: via-v30-web-stage
  cancel-in-progress: true
jobs:
  web-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check source and strict active V29.1.16 baseline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -m py_compile scripts/v30-web-release.py
          node --check scripts/v30-web-app.js
          node --check scripts/v30-web-store.js
          node --check scripts/v30-web-route-qa.mjs
          node --check scripts/v30-web-flow-regressions.mjs
          python3 -c "import runpy;f=runpy.run_path('scripts/via-v291-prepare.py');assert f['active_version']()=='f46757df-8ff2-4653-bec3-e15b8394a99a','Production web changed: stop'"
      - name: Reconstruct exact web source and patch only version/app/store, no GPS/OTP changes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/v30-web-release.py prepare
      - name: Publish only isolated QA stage, /api blocked unless browser mock
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.160.1 deploy --config v30-mvp-web-build/wrangler.qa.jsonc
          python3 scripts/v30-web-release.py qa
      - name: Browser engines for Android Chrome and iPhone WebKit
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps webkit >/dev/null
      - name: Verify selected GPS pin appears in real POST preview and 13.2km mock result
        run: node scripts/v30-web-route-qa.mjs
      - name: Verify 42 Android/iOS previous booking, GPS identity and browser regressions
        run: node scripts/v30-web-flow-regressions.mjs
      - name: Verify OTP/CORS, existing real route, geocoder, and signed APK on untouched production
        run: node tests/prod-core-invariants.mjs
      - name: Keep screenshots, original hash manifest and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-v30-web-pin-route-qa
          path: |
            v30-web-browser-proof/
            v30-proof/
            v30-mvp-web-build/manifest.json
          retention-days: 30
          if-no-files-found: warn
