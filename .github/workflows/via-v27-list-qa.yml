name: Vía Traslados - V27 listado premium QA y demo
on:
  push:
    branches: [via-listado-compacto-v27-qa-20261113]
    paths:
      - "android-driver/**"
      - ".github/workflows/via-v27-list-qa.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: via-v27-list-qa
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Comprobar pruebas funcionales existentes y formato
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run check
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Preparar Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar demo offline de V27 con identidad independiente
        run: |
          set -euo pipefail
          gradle -p android-driver :app:assembleDebug -PviaListPreview=true --no-daemon
          APK=android-driver/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='uy.viatraslados.conductor.v27preview'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='27'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -t "$APK" | tail -2
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: via-conductor-v27-compact-list-demo
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # La publicación externa está desactivada: existe otra V27 publicada y verificada.
