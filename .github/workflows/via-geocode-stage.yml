name: Via Traslados - preparar motor unico sin modificar produccion
on:
  push:
    branches: [main]
    paths: [".github/workflows/via-geocode-stage.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-release
      - name: Preparar motor desde fuente aprobada y copiar cierre temporal de producción
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib,urllib.request,urllib.error,re,hashlib,json
          account=os.environ['CF_ACCOUNT_ID'];token=os.environ['CF_TOKEN']
          assert re.fullmatch(r'[a-f0-9]{32}',account,re.I)
          api=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/via-traslados-web-prod'
          req=urllib.request.Request(api,headers={'Authorization':'Bearer '+token,'Accept-Encoding':'identity'})
          with urllib.request.urlopen(req,timeout=25) as r:
            raw=r.read();ctype=r.headers.get('Content-Type','')
          m=re.search(r'boundary="?([^";]+)',ctype);assert m,'Falta límite multipart'
          boundary=m.group(1).encode()
          parts=raw.split(b'--'+boundary)
          module=None
          for part in parts:
            if b'name="_worker.js"' in part:
              module=part.split(b'\r\n\r\n',1)[1].rstrip(b'\r\n');break
          assert module,'No se halló código original del Worker'
          original=module.decode('utf-8')
          assert 'var API_STATUS =' in original and 'var worker_default =' in original
          assert 'isPublicPage' in original and 'isClosed' in original and 'env.ASSETS.fetch(request)' in original
          a=original.index('var API_STATUS =')
          b=original.index('var worker_default =',a)
          maintenance=original[a:b]
          assert 'https://via-traslados-api.marcelof-gx.workers.dev/api/public/status' in maintenance
          assert 'function isClosed()' in maintenance
          canonical=pathlib.Path('pages/_worker.js').read_text('utf-8')
          assert 'function correctKnownPortal' in canonical and 'function directions' in canonical
          assert "path==='/api/direcciones'" in canonical
          geocoder=canonical.split('export default',1)[0]
          preserved='var __defProp = Object.defineProperty;\nvar __name = (target, value) => __defProp(target, "name", { value, configurable: true });\n'
          entry='''export default { async fetch(request, env) {
            const path = new URL(request.url).pathname;
            if (isPublicPage(request, path) && await isClosed()) return maintenance();
            return path === "/api/direcciones" ? directions(request) : env.ASSETS.fetch(request);
          } };\n'''
          new=preserved+'\n'+geocoder+'\n'+maintenance+'\n'+entry
          assert len(new)>4500 and new.count('export default')==1
          pathlib.Path('/tmp/via-worker-staged.mjs').write_text(new)
          pathlib.Path('/tmp/via-worker-meta.json').write_text(json.dumps({
            'main_module':'via-worker-staged.mjs',
            'keep_assets':True,
            'bindings':[{'type':'assets','name':'ASSETS'}],
            'compatibility_date':'2026-11-10',
            'annotations':{'workers/message':'Motor unificado QA/producción, conserva assets y mantenimiento; sin activar tráfico'}
          }))
          print('SOURCE_SHA',hashlib.sha256(original.encode()).hexdigest()[:16])
          print('CANONICAL_SHA',hashlib.sha256(canonical.encode()).hexdigest()[:16])
          print('STAGED_SHA',hashlib.sha256(new.encode()).hexdigest()[:16])
          print('Preservados: ASSETS, rutas, cierre temporal, origen principal.')
          PY
          cp /tmp/via-worker-staged.mjs /tmp/via-worker-check.mjs
          node --check /tmp/via-worker-check.mjs
      - name: Crear versión de prueba SIN activarla (no altera producción)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,urllib.error,uuid
          root=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/workers/scripts/via-traslados-web-prod/versions"
          boundary='ViaAudit'+uuid.uuid4().hex
          meta=pathlib.Path('/tmp/via-worker-meta.json').read_bytes()
          js=pathlib.Path('/tmp/via-worker-staged.mjs').read_bytes()
          body=(('--'+boundary+'\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n').encode()+meta+b'\r\n'
            +('--'+boundary+'\r\nContent-Disposition: form-data; name="via-worker-staged.mjs"; filename="via-worker-staged.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+js+b'\r\n'
            +('--'+boundary+'--\r\n').encode())
          req=urllib.request.Request(root,data=body,method='POST',headers={
            'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'multipart/form-data; boundary='+boundary,
            'Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=40) as r: obj=json.load(r)
          except urllib.error.HTTPError as e:
            err=e.read().decode('utf-8','replace')
            print('VERSION_UPLOAD_REJECTED',e.code,err[:500]);raise
          assert obj.get('success') is True,obj.get('errors')
          version=obj.get('result') or {}
          vid=version.get('id')
          assert isinstance(vid,str) and len(vid)>20
          pathlib.Path('/tmp/via-staged-version.txt').write_text(vid)
          print('VERSION_STAGED_NOT_DEPLOYED',vid)
          print('VERSION_PREVIEW_AVAILABLE',version.get('metadata',{}).get('hasPreview'))
          PY
      - name: Comprobar versión preliminar sin crear reservas
        run: |
          python3 - <<'PY'
          import os,pathlib,urllib.request,urllib.error,urllib.parse,json,hashlib,time
          vid=pathlib.Path('/tmp/via-staged-version.txt').read_text().strip()
          host=vid.split('-')[0]+'-via-traslados-web-prod.marcelof-gx.workers.dev'
          preview='https://'+host
          print('VERSION_PREVIEW_URL',preview)
          def get(url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ViaGeoAudit/1.0'}),timeout=22) as r:
                return r.status,r.read(500000)
            except urllib.error.HTTPError as e:return e.code,e.read(700)
            except Exception as e:return 'unavailable',str(type(e).__name__).encode()
          status,body=get('https://viatraslados.com/')
          print('PRODUCTION_ROOT',status,'sha',hashlib.sha256(body).hexdigest()[:16])
          for attempt in range(3):
            code,html=get(preview+'/')
            if code==200:break
            time.sleep(2)
          print('STAGE_ROOT',code,'sha',hashlib.sha256(html).hexdigest()[:16])
          if status!=200 or code!=200 or body!=html:
            print('VERSION_PREVIEW_NOT_VERIFIED; not activating production')
            raise SystemExit(1)
          base=preview+'/api/direcciones?'
          for mode in ['suggest','resolve']:
            url=base+urllib.parse.urlencode({'mode':mode,'q':'Roque Sáenz Peña 1711, Shangrilá, Canelones'})
            response,data=get(url)
            print('GEOCODE_STAGE',mode,response)
            if response!=200:raise SystemExit(1)
            obj=json.loads(data)
            rows=obj.get('results') or []
            assert rows
            first=rows[0]
            print('FIRST_RESULT',mode,{k:first.get(k) for k in ('street','city','department','accuracy')})
            assert 'shangril' in str(first.get('city','')).lower(), 'La primera coincidencia no respeta Shangrilá'
            assert 'canelones' in str(first.get('department','')).lower()
          print('STAGE_VERIFIED: same HTML/assets, new geocoder, existing maintenance gate')
          print('NO_PRODUCTION_TRAFFIC_CHANGED')
          PY
