name: Vía Traslados V29.1.16 - visual-only date/map guarded Android iOS QA
on:
  push:
    branches: [via-ui-date-map-v29116-20261123]
    paths:
      - ".github/workflows/via-v29116-qa.yml"
      - "scripts/via-v29116-release.py"
      - "scripts/via-v29116-date-ui.js"
      - "scripts/via-v29116-visual.css"
      - "scripts/via-v29116-map-point-picker.js"
      - "scripts/via-v29116-date-qa.mjs"
      - "scripts/via-v29116-map-qa.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: via-v29116-visual-qa
  cancel-in-progress: true
jobs:
  mobile-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts and exact active v29.1.15 production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -m py_compile scripts/via-v29116-release.py
          node --check scripts/via-v29116-date-ui.js
          node --check scripts/via-v29116-map-point-picker.js
          node --check scripts/via-v29116-date-qa.mjs
          node --check scripts/via-v29116-map-qa.mjs
          python3 -c "import runpy;lib=runpy.run_path('scripts/via-v291-prepare.py');assert lib['active_version']()=='e7830749-95f0-4a0e-8781-0e2ae6a19466','Prod drift';print('VIA_V29116_BASELINE_PASS')"
      - name: Rebuild real web Worker with only UI patch and checksum-protected geographic engine
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-v29116-release.py prepare
      - name: Deploy isolated QA, disable real API and confirm static source
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.160.1 deploy --config mine-v29116-build/wrangler.qa.jsonc
          python3 scripts/via-v29116-release.py qa
      - name: Install Chrome Android and WebKit iOS with original Leaflet engine
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1 leaflet@1.9.4
          npx playwright install --with-deps webkit >/dev/null
      - name: Eight real browser date output full-year/native-picker/BFCache/no-scroll tests
        run: node scripts/via-v29116-date-qa.mjs
      - name: Eighteen real browser map reverse lookup/coordinate/door and two-line formatting tests
        run: node scripts/via-v29116-map-qa.mjs
      - name: Retain 42 new booking and GPS identity regressions
        run: node scripts/via-v29115-flow-regressions.mjs
      - name: Retain eight guest sign-in/keyboard regressions
        env:
          VIA_V2918_QA: https://via-traslados-mine-v2917-stage.marcelof-gx.workers.dev
        run: node scripts/via-mine-v2918-keyboard-qa.mjs
      - name: Retain seven authenticated Mis reservas history/pagination regressions
        env:
          VIA_MINE_PREMIUM_QA: https://via-traslados-mine-v2917-stage.marcelof-gx.workers.dev/
        run: node scripts/via-mine-v29110-browser.mjs
      - name: Confirm production OTP CORS geocoder/route and signed APK availability, no writes
        run: node tests/prod-core-invariants.mjs
      - name: Save before-after screenshots and exact source hash manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-v29116-date-map-chrome-webkit-proof
          path: |
            via-v29116-date-proof/
            via-v29116-map-proof/
            via-v29115-proof/
            mine-v2918-proof/
            mine-v29110-proof/
            mine-v29116-build/manifest.json
          retention-days: 30
          if-no-files-found: warn
