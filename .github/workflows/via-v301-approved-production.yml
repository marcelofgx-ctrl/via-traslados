name: "Vía V30.1 — publicación productiva QA2 aprobada"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths: [".github/workflows/via-v301-approved-production.yml"]
permissions:
  contents: read
concurrency:
  group: via-v30-poi-prod-api-web-atomic
  cancel-in-progress: false
jobs:
  release:
    if: "github.event.head_commit.message == 'release: promote user-approved V30 QA2 to production'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Tests de regresión y paquete WEB desde producción activa
        run: |
          npm test
          python3 -m py_compile scripts/v301-approved-production.py
          python3 scripts/v301-approved-production.py build
          npx --yes wrangler@4.160.1 deploy --config v30-poi-prod-build/wrangler.web.jsonc --dry-run --keep-vars
      - name: Comprobar API candidata exacta sin tráfico productivo
        run: node scripts/v301-release-smoke.mjs preview
      - name: Promover versión API ya validada sin recompilar
        id: promote
        run: python3 scripts/v301-approved-production.py promote
      - name: Validar API activa y rutas antes de publicar web
        run: node scripts/v301-release-smoke.mjs api
      - name: Publicar exclusivamente WEB V30.1
        run: npx --yes wrangler@4.160.1 deploy --config v30-poi-prod-build/wrangler.web.jsonc --keep-vars
      - name: Verificar buscador, IDE, OTP, rutas y APK públicos
        run: |
          node scripts/v301-release-smoke.mjs web
          node tests/prod-core-invariants.mjs
          python3 scripts/v301-approved-production.py final
      - name: Rollback obligatorio de ambos Workers si falla tras promoción
        if: failure() && steps.promote.outcome != 'skipped'
        run: node scripts/v30-poi-prod-rollback.mjs
      - name: Guardar manifiesto de versiones y hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-v301-production-manifest
          path: v30-poi-prod-build/manifest.json
          retention-days: 30
          if-no-files-found: ignore
