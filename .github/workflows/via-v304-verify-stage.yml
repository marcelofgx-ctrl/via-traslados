name: "Vía V30.4 — revalidar QA real y teclado"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths: [".github/workflows/via-v304-verify-stage.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Consultas reales
        run: node scripts/v304-search-smoke.mjs
      - name: Comprobar D1 real sin consultar datos personales
        if: always()
        run: python3 scripts/v304-cache-audit.py
      - name: Comprobar espacio visible Android e iOS
        if: always()
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit >/dev/null
          node scripts/v304-viewport-browser.mjs
      - name: Confirmar producción intacta
        if: always()
        run: python3 -c "import runpy;runpy.run_path('scripts/v304-search-stage.py')['baseline']();print('VIA_V304_PROD_UNCHANGED')"
