name: "Vía V30.2 — promover WEB exacta validada"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths: [".github/workflows/via-v302-approved-production.yml"]
permissions:
  contents: read
concurrency:
  group: via-v30-poi-prod-api-web-atomic
  cancel-in-progress: false
jobs:
  release:
    if: "github.event.head_commit.message == 'release: promote approved V30.2 route cache WEB only'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validar candidato exacto y preparar navegador antes de publicar
        run: |
          npm test
          python3 scripts/v302-approved-production.py verify
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Promover exclusivamente WEB V30.2
        id: promote
        run: python3 scripts/v302-approved-production.py promote
      - name: Validar navegador real, caché y núcleo productivo
        run: |
          node scripts/v302-production-browser.mjs
          node tests/prod-core-invariants.mjs
          python3 scripts/v302-approved-production.py final
      - name: Restaurar WEB V30.1 si falla después de promover
        if: failure() && steps.promote.outcome != 'skipped'
        run: python3 scripts/v302-approved-production.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-v302-production-manifest
          path: v302-release-check/manifest.json
          if-no-files-found: ignore
          retention-days: 30
