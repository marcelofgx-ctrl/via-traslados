name: Vía Traslados — Clonar producción actual a QA aislada
on:
  push:
    branches: [via-prod-snapshot-qa-20261120]
    paths: ['.github/workflows/via-current-prod-qa.yml', 'scripts/via-current-prod-qa.py', 'scripts/via-qa-browser-diagnostics.js', 'scripts/via-qa-directions-worker.mjs']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: via-current-prod-qa-only
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Download actual production snapshot read-only
        run: |
          set -euo pipefail
          python3 scripts/via-current-prod-qa.py
          node --check via-current-qa/assets/app.js
          node --check via-current-qa/assets/via-qa-browser-diagnostics.js
          node --check via-current-qa/worker.mjs
          node --check via-current-qa/geo-directions.mjs
      - name: Verify isolation and critical integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('via-current-qa');a=p/'assets';m=json.loads((p/'production-manifest.json').read_text())
          for name in ('app.js','store.js','geo-v2/core.mjs','descargas/via-traslados-conductor-v35.apk'):
           assert hashlib.sha256((a/name).read_bytes()).hexdigest()==m['production_sha256'][name],name
          assert "QA aislada" in (p/'worker.mjs').read_text()
          assert "geo.fetch(req,env)" in (p/'worker.mjs').read_text()
          assert "/api/public/route-preview" in (p/'worker.mjs').read_text()
          assert "direcciones.ide.uy" in (p/'geo-directions.mjs').read_text()
          assert "viatraslados.com/api/direcciones" not in (p/'worker.mjs').read_text()
          assert 'apiUrl:location.origin' in (a/'config.js').read_text()
          assert 'via-traslados-api.marcelof-gx.workers.dev' not in (a/'config.js').read_text()
          assert 'via-qa-version' in (a/'index.html').read_text()
          assert 'via-qa-browser-compat' in (a/'index.html').read_text()
          assert 'QA v29.1.8' in (a/'index.html').read_text()
          assert 'via-qa-browser-diagnostics.js?v=2918' in (a/'index.html').read_text()
          assert (a/'via-qa-browser-diagnostics.js').stat().st_size>2000
          print('QA_SNAPSHOT_SAFE',m['production_worker_version'])
          PY
      - name: Deploy ONLY isolated QA Worker
        run: npx --yes wrangler@4.160.1 deploy --config via-current-qa/wrangler.jsonc
      - name: Verify QA pages and deny API writes
        run: |
          set -euo pipefail
          URL=https://via-traslados-current-prod-qa.marcelof-gx.workers.dev
          for n in $(seq 1 20); do
            if curl -fsSL "$URL/" | grep -q 'via-qa-version'; then break; fi
            sleep 5
          done
          curl -fsSL "$URL/mis-reservas.html" | grep -q 'Mis reservas'
          curl -fsSL "$URL/via-qa-browser-diagnostics.js" | grep -q 'Diagnóstico QA'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/requests" -H 'content-type: application/json' --data '{}')" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/customer/me")" = 503
          curl -fsSL "$URL/api/direcciones?mode=places&q=aeropuerto" | python3 -c 'import json,sys; assert any("Carrasco" in x.get("label","") for x in json.load(sys.stdin)["results"])'
          curl -fsSL "$URL/api/direcciones?mode=reverse&lat=-34.905&lng=-56.185" | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin).get("results"),list)'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/public/route-preview" -H 'content-type: application/json' --data '{}')" = 400
          curl -fsSL "$URL/config.js" | grep -q 'apiUrl:location.origin'
          echo "QA_SNAPSHOT_DEPLOYED_NO_PROD_WRITES $URL"
      - name: Store exact source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-current-production-snapshot-manifest
          path: via-current-qa/production-manifest.json
          retention-days: 30
