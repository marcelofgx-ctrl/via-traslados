name: Vía Traslados — Clonar producción actual a QA aislada
on:
  push:
    branches: [via-prod-snapshot-qa-20261120]
    paths: ['.github/workflows/via-current-prod-qa.yml', 'scripts/via-current-prod-qa.py', 'scripts/via-qa-browser-diagnostics.js', 'scripts/via-qa-directions-worker.mjs', 'scripts/via-qa-route-contract.mjs', 'scripts/via-qa-smoke.py', 'scripts/via-qa-routing-worker.mjs', 'scripts/via-qa-simulator-contract.mjs']
  workflow_dispatch:
permissions: {contents: read, statuses: write}
concurrency:
  group: via-current-prod-qa-only
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate QA code syntax before snapshot
        run: |
          python3 -m py_compile scripts/via-current-prod-qa.py scripts/via-qa-smoke.py
          node --check scripts/via-qa-browser-diagnostics.js
          node --check scripts/via-qa-directions-worker.mjs
          node --check scripts/via-qa-route-contract.mjs
          node --check scripts/via-qa-routing-worker.mjs
          node --check scripts/via-qa-simulator-contract.mjs
      - name: Download actual production snapshot read-only
        run: |
          set -euo pipefail
          python3 scripts/via-current-prod-qa.py
          node --check via-current-qa/assets/app.js
          node --check via-current-qa/assets/config.js
          node --check via-current-qa/assets/store.js
          node --check via-current-qa/assets/via-qa-browser-diagnostics.js
          node --check via-current-qa/worker.mjs
          node --check via-current-qa/geo-directions.mjs
          node scripts/via-qa-route-contract.mjs
          node scripts/via-qa-simulator-contract.mjs
      - name: Verify isolation and critical integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('via-current-qa');a=p/'assets';m=json.loads((p/'production-manifest.json').read_text())
          for name in ('app.js','geo-v2/core.mjs','descargas/via-traslados-conductor-v35.apk'):
           assert hashlib.sha256((a/name).read_bytes()).hexdigest()==m['production_sha256'][name],name
          assert "QA aislada" in (p/'worker.mjs').read_text()
          assert "window.ViaAddress?.get?.(key)" in (a/'store.js').read_text()
          assert hashlib.sha256((a/'store.js').read_bytes()).hexdigest()!=m['production_sha256']['store.js']
          assert "geo.fetch(req,env)" in (p/'worker.mjs').read_text()
          assert "/api/public/route-preview" in (p/'worker.mjs').read_text()
          assert 'router.project-osrm.org' in (p/'worker.mjs').read_text()
          assert 'routing.openstreetmap.de' in (p/'worker.mjs').read_text()
          assert 'valhalla1.openstreetmap.de' in (p/'worker.mjs').read_text()
          assert 'ROUTE_API' not in (p/'worker.mjs').read_text()
          assert '"services"' not in (p/'wrangler.jsonc').read_text()
          assert "direcciones.ide.uy" in (p/'geo-directions.mjs').read_text()
          assert "viatraslados.com/api/direcciones" not in (p/'worker.mjs').read_text()
          assert 'apiUrl:location.origin' in (a/'config.js').read_text()
          assert 'via-traslados-api.marcelof-gx.workers.dev' not in (a/'config.js').read_text()
          assert 'via-qa-version' in (a/'index.html').read_text()
          assert 'via-qa-browser-compat' in (a/'index.html').read_text()
          assert 'QA v29.1.12' in (a/'index.html').read_text()
          assert 'position:fixed;top:calc(env(safe-area-inset-top,0px) + 118px)' not in (a/'index.html').read_text()
          assert 'via-qa-controls' in (a/'via-qa-browser-diagnostics.js').read_text()
          assert 'position:relative' in (a/'via-qa-browser-diagnostics.js').read_text()
          assert 'store.js?v=qa29112' in (a/'index.html').read_text()
          assert 'config.js?v=qa29112' in (a/'index.html').read_text()
          assert 'qa_sim' in (a/'config.js').read_text()
          assert 'SIMULACIÓN QA' in (a/'via-qa-browser-diagnostics.js').read_text()
          assert 'via-qa-browser-diagnostics.js?v=29112' in (a/'index.html').read_text()
          assert (a/'via-qa-browser-diagnostics.js').stat().st_size>2000
          print('QA_SNAPSHOT_SAFE',m['production_worker_version'])
          PY
      - name: Deploy ONLY isolated QA Worker
        run: npx --yes wrangler@4.160.1 deploy --config via-current-qa/wrangler.jsonc
      - name: Verify QA pages, route and denied writes with explicit checks
        id: smoke
        run: |
          set -euo pipefail
          python3 -u scripts/via-qa-smoke.py
      - name: Publish QA test result as commit status (allows verification without screenshots)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            STATE=success
            DESCRIPTION="QA route and write isolation passed"
          else
            STATE=failure
            DESCRIPTION="QA route or another required smoke check failed"
          fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" -f context="via-qa/road-routing" \
            -f description="$DESCRIPTION" -f target_url="$RUN_URL"
      - name: Store exact source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via-current-production-snapshot-manifest
          path: via-current-qa/production-manifest.json
          retention-days: 30
