name: Vía Traslados V29.1.13 - independent read-only final live confirmation
on:
  push:
    branches: [via-mine-v29113-inicio-no-clip-20261122]
    paths: [".github/workflows/via-mine-v29113-postprod.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck live Cloudflare version, actual CSS, safe rollback and functional assets (GET only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/via-mine-v29113-postprod.py
      - name: Recheck OTP, public route, geocoder and APK without bookings
        run: node tests/prod-core-invariants.mjs
