name: Via Traslados - auditoria unica del esquema D1 (solo lectura)
on:
  push:
    branches: [main]
    paths: [".github/workflows/via-d1-isolation-once.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Leer solo los nombres de las tablas de via-traslados-db
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          root=f'https://api.cloudflare.com/client/v4/accounts/{os.environ["CF_ACCOUNT"]}/d1/database'
          auth={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'}
          def call(url, data=None):
            req=urllib.request.Request(url,headers=auth,method='POST' if data is not None else 'GET',data=json.dumps(data).encode() if data is not None else None)
            with urllib.request.urlopen(req,timeout=25) as response:
              obj=json.load(response)
            assert obj.get('success') is True,obj.get('errors')
            return obj.get('result')
          all_dbs=call(root)
          if isinstance(all_dbs,dict):all_dbs=all_dbs.get('databases') or []
          via=[x for x in all_dbs if x.get('name')=='via-traslados-db']
          assert len(via)==1,'No existe una sola D1 exclusiva via-traslados-db'
          db=via[0]
          uuid=db.get('uuid') or db.get('id')
          assert uuid
          result=call(root+'/'+uuid+'/query',{'sql':"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"})
          if isinstance(result,list):
            rows=result[0].get('results') or []
          elif isinstance(result,dict):rows=result.get('results') or []
          else:rows=[]
          tables=sorted([str(x['name']) for x in rows if isinstance(x,dict) and 'name' in x])
          print('VIA_D1_DATABASE_FOUND',db.get('name'))
          print('VIA_D1_TABLE_NAMES',tables)
          assert 'bookings' in tables,'No existe tabla de reservas de Vía Traslados'
          unexpected=[t for t in tables if any(k in t.lower() for k in ['quicktrip','quick_trip','fila_carga','oak_ember','flight_','vuelos'])]
          assert not unexpected,('Se detectaron tablas con nombres de otros proyectos',unexpected)
          print('D1_ISOLATION_SCHEMA_OK; sin leer usuarios, solicitudes ni modificar datos')
          PY
