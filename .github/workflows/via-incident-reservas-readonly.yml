name: Incidente reservas Vía — auditoría D1 solo lectura
on:
  push:
    branches: [incident-reservas-operador-audit-20261118]
    paths: [".github/workflows/via-incident-reservas-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verificar solicitudes, ofertas, asignaciones y permisos D1 PROD sin escrituras
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/incident-reservas-operador-readonly.mjs
