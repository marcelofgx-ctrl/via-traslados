name: "Vía V30.3 — búsqueda flexible QA"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths: [".github/workflows/via-v303-search-stage.yml"]
permissions:
  contents: read
concurrency:
  group: via-v303-search-stage
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Pruebas y paquete aislado
        run: |
          npm test
          python3 scripts/v303-search-stage.py
          node --check v303-search-stage/worker.mjs
          npx --yes wrangler@4.160.1 deploy --config v303-search-stage/wrangler.jsonc --dry-run
      - name: Publicar solo QA
        run: npx --yes wrangler@4.160.1 deploy --config v303-search-stage/wrangler.jsonc
      - name: Consultas reales y regresión rutas
        run: node scripts/v303-search-smoke.mjs
      - name: Confirmar producción intacta
        run: python3 -c "import runpy;runpy.run_path('scripts/v303-search-stage.py')['baseline']();print('VIA_V303_PROD_UNCHANGED')"
