name: Vía Traslados — respaldo íntegro D1 antes de reinicio
on:
  push:
    branches: [via-v35-reset-audit-perf-20261117]
    paths: [".github/workflows/via-v35-d1-full-backup-before-reset.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: via-v35-d1-prod-maintenance
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Confirmar acceso ÚNICAMENTE a D1 via-traslados-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-d1.mjs
      - name: Generar wrangler.toml temporal para base prod exclusiva
        env:
          VIA_PUBLIC_ORIGIN: ${{ vars.VIA_PUBLIC_ORIGIN }}
          VIA_RESEND_FROM: ${{ vars.VIA_RESEND_FROM }}
        run: |
          set -euo pipefail
          node scripts/create-wrangler.mjs
          grep -Fx 'database_name = "via-traslados-db"' wrangler.toml
          grep -Fx 'name = "via-traslados-api"' wrangler.toml
      - name: Exportar SQL íntegro ANTES de cualquier limpieza, sin publicar datos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/via-d1-backup-private"
          npx --yes wrangler@4.160.1 d1 export via-traslados-db --remote --config wrangler.toml --output "$RUNNER_TEMP/via-d1-backup-private/via-traslados-prod-before-reset.sql"
          test -s "$RUNNER_TEMP/via-d1-backup-private/via-traslados-prod-before-reset.sql"
          sha256sum "$RUNNER_TEMP/via-d1-backup-private/via-traslados-prod-before-reset.sql" | sed "s#.*  # #g" > "$RUNNER_TEMP/via-d1-backup-private/SQL-SHA256.txt"
          echo 'Cloudflare export D1 completado. El respaldo privado no se imprime en logs.'
      - name: Validar restauración completa OFFLINE sin tocar Cloudflare
        run: |
          set -euo pipefail
          sqlite3 "$RUNNER_TEMP/via-d1-restore-test.sqlite" < "$RUNNER_TEMP/via-d1-backup-private/via-traslados-prod-before-reset.sql"
          test "$(sqlite3 "$RUNNER_TEMP/via-d1-restore-test.sqlite" 'PRAGMA integrity_check;')" = ok
          test "$(sqlite3 "$RUNNER_TEMP/via-d1-restore-test.sqlite" 'PRAGMA foreign_key_check;' | wc -c)" -eq 0
          b=$(sqlite3 "$RUNNER_TEMP/via-d1-restore-test.sqlite" 'SELECT count(*) FROM bookings;')
          test "$b" -eq 25
          test "$(sqlite3 "$RUNNER_TEMP/via-d1-restore-test.sqlite" "SELECT count(*) FROM staff_users WHERE role='admin' AND status='approved';")" -eq 1
          printf 'Backup restaurable en SQLite, integridad correcta: %s reservas, administrador preservado.\n' "$b"
      - name: Archivo adicional con alcance y fecha de respaldo
        run: |
          set -euo pipefail
          printf 'Via Traslados. Exclusivamente D1 via-traslados-db\nBackup antes de reset controlado de reservas y pasajeros\nFecha UTC: %s\nWorkflow GitHub run: %s\nUSO PRIVADO: contiene datos personales y tokens.\nNo compartir ni publicar en una web.\n' "$(date -u -Iseconds)" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/via-d1-backup-private/LEER-PRIMERO.txt"
      - name: Guardar backup PRIVADO recuperable 90 días — requisito antes de reset
        uses: actions/upload-artifact@v4
        with:
          name: VIA_TRASLADOS_D1_PROD_FULL_BACKUP_BEFORE_RESET_PRIVATE
          path: ${{ runner.temp }}/via-d1-backup-private/*
          retention-days: 90
          if-no-files-found: error
