name: INCIDENTE producción — límites OTP y rutas D1 read-only
on:
  push:
    branches: [incident-otp-distance-readonly-rollback-20261118]
    paths: [".github/workflows/via-incident-d1-rates-readonly.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Consultar D1 de producción EXCLUSIVAMENTE SELECT sin datos personales
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/incident-d1-otp-route-limits-readonly.mjs
