name: Vía — geographic resilience guarded integration and activation
on:
  push:
    branches: [via-geography-resilience-20261126]
    paths: ['.github/workflows/via-geography-resilience-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: via-v30-poi-prod-api-web-atomic
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require successful exact candidate builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/actions/runs/45836917606 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/runs/45837199065 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/15125517414 --jq .digest)" = sha256:3ae2a4cb1d20d004c54146590f14ad8515dc5e7a9499ee6b90e2868da26249d3
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/15126736295 --jq .digest)" = sha256:0fe31bdfbfd8fc885c164a96a26306982c0dc77cbf95f2bdaaeb1602e468cb9a
      - uses: actions/download-artifact@v4
        with:
          name: via-resilience-candidate
          run-id: 45836917606
          github-token: ${{ github.token }}
          path: via-resilience
      - uses: actions/download-artifact@v4
        with:
          name: via-resilience-web-candidate
          run-id: 45837199065
          github-token: ${{ github.token }}
          path: via-resilience
      - name: Add geographic cache only and activate additive API
        id: api
        run: python3 scripts/via-resilience-release.py api
      - name: Test complete candidate through actual service binding
        run: node scripts/via-resilience-integration.mjs candidate
      - name: Activate exact web candidate
        run: python3 scripts/via-resilience-release.py web
      - name: Verify production real address, cache, POI, GPS and route
        run: |
          node scripts/via-resilience-integration.mjs prod
          python3 scripts/via-resilience-release.py final
      - name: Roll back both versions on failure
        if: failure() && steps.api.outcome != 'skipped'
        run: python3 scripts/via-resilience-release.py rollback
