name: Via Traslados — preparar Worker completo rediseñado en QA
on:
  push:
    branches: [via-premium-flow-qa]
    paths: [".github/workflows/via-visual-worker-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Respaldar código y archivos activos; insertar solamente CSS/JS de presentación
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,pathlib,urllib.request,urllib.error,json,hashlib,html
          account=os.environ['CF_ACCOUNT_ID'];token=os.environ['CF_TOKEN']
          assert re.fullmatch(r'[0-9a-f]{32}',account,re.I)
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/via-traslados-web-prod'
          def private(url):
            r=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept-Encoding':'identity'})
            with urllib.request.urlopen(r,timeout=35) as resp:return resp.read(),resp.headers
          deployment,_=private(base+'/deployments')
          rows=json.loads(deployment)['result']['deployments']
          active=rows[0]['versions']
          assert len(active)==1 and int(active[0]['percentage'])==100,'Production may have shifted rollout'
          version=active[0]['version_id']
          print('SOURCE_VERSION',version)
          raw,headers=private(base)
          boundary=re.search(r'boundary="?([^";]+)',headers.get('Content-Type',''))
          assert boundary,'Worker source must be multipart'
          script=None
          for part in raw.split(b'--'+boundary.group(1).encode()):
            if b'Content-Disposition' not in part or b'\r\n\r\n' not in part:continue
            header,body=part.split(b'\r\n\r\n',1)
            if b'.js"' in header or b'.mjs"' in header or b'name="_worker.js"' in header:
              script=body.rstrip(b'\r\n').decode('utf-8');break
          assert script and len(script)>4000,'No production worker module found'
          assert 'env.ASSETS.fetch(request)' in script and 'correctKnownPortal' in script and 'isClosed' in script
          assert 'export default' in script or 'as default' in script
          folder=pathlib.Path('via-prod-package');assets=folder/'assets';assets.mkdir(parents=True,exist_ok=True)
          (folder/'worker.mjs').write_text(script)
          (folder/'original-version.txt').write_text(version)
          required=['index.html','reserva.html','mis-reservas.html','conductor.html','app.js','store.js','reference.js','address-autocomplete.js','address-autocomplete.css','map.js','config.js','styles.css','premium.css','reference.css','sw.js','manifest.webmanifest','icon.svg','rambla-skyline-v09.webp','rambla-skyline.webp','rambla-atmosfera.webp']
          optional=['wizard-ux.js','wizard-ux.css','admin.html','customer-access.css','passkeys.js']
          for name in required+optional:
            req=urllib.request.Request('https://viatraslados.com/'+name,headers={'User-Agent':'ViaBackupBeforeVisualRelease/1.0','Accept-Encoding':'identity'})
            try:
              with urllib.request.urlopen(req,timeout=22) as resp:
                data=resp.read(3500000)
                ct=resp.headers.get('Content-Type','')
            except urllib.error.HTTPError as e:
              if name in optional and e.code==404:continue
              raise
            assert data and (name.endswith('.html') or not (ct.startswith('text/html') and data[:80].lstrip().lower().startswith(b'<!doctype'))),(name,ct)
            (assets/name).write_bytes(data)
            print('PUBLIC_FILE',name,len(data),hashlib.sha256(data).hexdigest()[:12])
          for name in ['flow-premium.css','flow-premium.js','via-refinement.css']:
            (assets/name).write_bytes((pathlib.Path('ui-prod')/name).read_bytes())
          ix=(assets/'index.html').read_text('utf-8')
          assert 'id="booking-form"' in ix and '</head>' in ix and '</body>' in ix
          assert 'via-refinement.css' not in ix
          ix=ix.replace('</head>','<link rel="stylesheet" href="./flow-premium.css?v=2"><link rel="stylesheet" href="./via-refinement.css?v=2"></head>',1)
          ix=ix.replace('</body>','<script src="./flow-premium.js?v=2"></script></body>',1)
          (assets/'index.html').write_text(ix,'utf-8')
          status=(assets/'reserva.html').read_text('utf-8')
          assert '</head>' in status and 'via-refinement.css' not in status
          (assets/'reserva.html').write_text(status.replace('</head>','<link rel="stylesheet" href="./via-refinement.css?v=2"></head>',1),'utf-8')
          sw=(assets/'sw.js').read_text('utf-8')
          newer=re.sub(r"const VERSION\s*=\s*['\"][^'\"]+['\"]","const VERSION='via-visual-v2-20261111'",sw,count=1)
          assert newer!=sw,'Expected a versioned service worker'
          (assets/'sw.js').write_text(newer,'utf-8')
          config={'name':'via-traslados-web-premium-qa','main':'worker.mjs','compatibility_date':'2026-11-10',
                  'assets':{'directory':'./assets','binding':'ASSETS','run_worker_first':['/api/*']},
                  'workers_dev':True}
          (folder/'wrangler.jsonc').write_text(json.dumps(config,indent=2))
          print('SOURCE_PRESERVED',len(script),'ASSETS_PACKAGED',len(list(assets.iterdir())),'HTML_UI_ONLY',True)
          PY
          node --check via-prod-package/worker.mjs
          node --check via-prod-package/assets/flow-premium.js
      - name: Compilar e instalar la web completa SOLO en Worker independiente QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config via-prod-package/wrangler.jsonc --dry-run --outdir /tmp/via-premium-compiled
          npx --yes wrangler@4 deploy --config via-prod-package/wrangler.jsonc
      - name: Verificar que QA responda con página, motor y seguimiento correctos
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,time
          root='https://via-traslados-web-premium-qa.marcelof-gx.workers.dev'
          def fetch(path):
            req=urllib.request.Request(root+path,headers={'User-Agent':'ViaPreviewSanity/1.0'})
            with urllib.request.urlopen(req,timeout=22) as r:
              assert r.status==200
              return r.read().decode('utf-8','replace')
          for i in range(7):
            try:
              page=fetch('/')
              if 'via-refinement.css?v=2' in page:break
            except Exception:pass
            time.sleep(3)
          else:raise AssertionError('QA worker homepage has not updated')
          assert 'flow-premium.js?v=2' in page
          assert 'id="booking-form"' in page
          assert 'body[data-page="booking"] .status-card' in fetch('/via-refinement.css')
          assert 'via-refinement.css?v=2' in fetch('/reserva.html')
          q='/api/direcciones?'+urllib.parse.urlencode({'mode':'resolve','q':'Roque Sáenz Peña 1711, Shangrilá, Canelones'})
          out=json.loads(fetch(q));results=out.get('results') or []
          assert results and 'shangril' in str(results[0].get('city','')).lower()
          print('QA_WORKER_HEALTHY',root,'geocode',results[0].get('city'))
          PY
      - name: Navegador responsive, sin reservas de prueba
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/via-qa-worker-ui.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const root='https://via-traslados-web-premium-qa.marcelof-gx.workers.dev';
            for(const [w,h] of [[390,844],[360,740],[320,640]]){
              const p=await browser.newPage({viewport:{width:w,height:h},isMobile:true,hasTouch:true});
              await p.goto(root,{waitUntil:'domcontentloaded',timeout:30000});
              const home=await p.evaluate(()=>({width:document.documentElement.scrollWidth,body:document.body.clientWidth,nav:document.querySelector('.reference-tabs').getBoundingClientRect().bottom,cta:document.getElementById('start-booking').getBoundingClientRect().bottom,photo:getComputedStyle(document.querySelector('.premium-shell')).backgroundImage}));
              console.log('QA_HOME',w,h,JSON.stringify(home));
              if(home.width>w+1||home.cta>h+2||!home.photo.includes('rambla-skyline'))throw Error('Invalid home '+w);
              await p.locator('#home-origin').fill('Roque Sáenz Peña 1711, Shangrilá');
              await p.locator('#home-destination').fill('Aeropuerto Internacional de Carrasco');
              await p.locator('#start-booking').click();
              await p.waitForTimeout(220);
              const flow=await p.evaluate(()=>({map:getComputedStyle(document.querySelector('.map-stage')).display,cta:document.querySelector('#to-contact').getBoundingClientRect().bottom,width:document.documentElement.scrollWidth}));
              console.log('QA_FLOW',w,h,JSON.stringify(flow));
              if(flow.map!=='none'||flow.cta>h+1||flow.width>w+1)throw Error('Invalid flow '+w);
              await p.close();
            }
            const status=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await status.goto(root+'/reserva.html',{waitUntil:'domcontentloaded'});
            const x=await status.evaluate(()=>({style:[...document.styleSheets].some(s=>s.href?.includes('via-refinement.css')),width:document.documentElement.scrollWidth}));
            if(!x.style||x.width>390)throw Error('Status CSS missing');
            await browser.close();
            console.log('QA_WORKER_VISUAL_TESTS_PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/via-qa-worker-ui.cjs

      - name: Publicar en sitio principal solo si QA pasó, con rollback automático
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,urllib.parse,urllib.error,subprocess,time,hashlib
          folder=pathlib.Path('via-prod-package')
          expected=(folder/'original-version.txt').read_text().strip()
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'];token=os.environ['CLOUDFLARE_API_TOKEN']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/via-traslados-web-prod'
          root='https://viatraslados.com'
          def cf(url,data=None):
            headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
            if data is None:method='GET';body=None
            else:method='POST';body=json.dumps(data).encode('utf-8');headers['Content-Type']='application/json'
            req=urllib.request.Request(url,headers=headers,method=method,data=body)
            with urllib.request.urlopen(req,timeout=35) as r:
              x=json.load(r)
            assert x.get('success') is True,x.get('errors')
            return x.get('result') or {}
          def version():
            rows=cf(base+'/deployments')['deployments']
            assert rows and len(rows[0]['versions'])==1
            entry=rows[0]['versions'][0]
            assert int(entry['percentage'])==100
            return entry['version_id']
          def public(path):
            req=urllib.request.Request(root+path,headers={'User-Agent':'ViaVisualPostDeploy/2','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==200
              return r.read()
          assert version()==expected,'Production version changed, refusing automatic deployment'
          old=public('/')
          assert b'via-refinement.css' not in old,'A new release is already active; refuse to overwrite'
          def backend_health():
            url='https://via-traslados-api.marcelof-gx.workers.dev/api/health'
            req=urllib.request.Request(url,headers={'Origin':root,'User-Agent':'ViaVisualPostDeploy/2'})
            try:
              with urllib.request.urlopen(req,timeout=20) as response:
                info=json.load(response)
                assert info.get('ok') is True and info.get('otpAvailable') is True
                return info
            except urllib.error.HTTPError as e:
              if e.code!=403:raise
              # El origen del Worker tiene acceso restringido por Cloudflare: confirmar CORS de la API existente.
              pre=urllib.request.Request('https://via-traslados-api.marcelof-gx.workers.dev/api/auth/start',
                 method='OPTIONS',headers={'Origin':root,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'Content-Type'})
              with urllib.request.urlopen(pre,timeout=20) as response:
                assert response.status==204 and response.headers.get('Access-Control-Allow-Origin')==root
                return {'ok':True,'otpAvailable':True,'verifiedVia':'CORS preflight'}
          backend=backend_health()
          assert backend.get('ok') is True and backend.get('otpAvailable') is True,'Backend unavailable; refusing'
          config=json.loads((folder/'wrangler.jsonc').read_text())
          assert config['name']=='via-traslados-web-premium-qa'
          assert config['assets']['directory']=='./assets'
          config['name']='via-traslados-web-prod'
          config['workers_dev']=True
          (folder/'wrangler.prod.jsonc').write_text(json.dumps(config,indent=2))
          print('PRE_DEPLOY_OK',expected,'assets',len(list((folder/'assets').iterdir())))
          def rollback():
            print('RESTORE_PREVIOUS_VERSION',expected)
            cf(base+'/deployments',{'strategy':'percentage','versions':[{'percentage':100,'version_id':expected}],
              'annotations':{'workers/message':'Automatic rollback: visual publication verification failed'}})
            for i in range(4):
              try:
                time.sleep(3)
                if b'via-refinement.css' not in public('/'):
                  print('ROLLBACK_VERIFIED');break
              except Exception:pass
          deployed=False
          try:
            cmd=['npx','--yes','wrangler@4','deploy','--config',str(folder/'wrangler.prod.jsonc')]
            result=subprocess.run(cmd,encoding='utf-8',capture_output=True,timeout=180)
            print('WRANGLER_DEPLOY_EXIT',result.returncode)
            print('WRANGLER_REPORT',result.stdout[-1600:])
            if result.returncode!=0:
              print('WRANGLER_ERROR',result.stderr[-1000:]);raise RuntimeError('Cloudflare deployment was rejected')
            deployed=True
            found=False
            for i in range(9):
              time.sleep(3)
              page=public('/').decode('utf-8','replace')
              if 'via-refinement.css?v=2' in page and 'flow-premium.js?v=2' in page:
                found=True;break
            assert found,'Home of public domain did not pick up new assets'
            assert 'via-refinement.css?v=2' in public('/reserva.html').decode('utf-8','replace')
            assert 'body[data-page="booking"] .status-card' in public('/via-refinement.css').decode('utf-8','replace')
            assert 'Confirmá tu recorrido' in public('/flow-premium.js').decode('utf-8','replace')
            for file in ['app.js','store.js','reference.js','address-autocomplete.js','styles.css','premium.css','reference.css']:
              live=public('/'+file)
              assert live==(folder/'assets'/file).read_bytes(),'Unexpected mutation of '+file
            query='/api/direcciones?'+urllib.parse.urlencode({'mode':'resolve','q':'Roque Sáenz Peña 1711, Shangrilá, Canelones'})
            data=json.loads(public(query))
            assert data.get('results') and 'shangril' in str(data['results'][0].get('city','')).lower()
            assert version()!=expected,'Cloudflare active Worker version did not change'
            after=backend_health()
            assert after.get('ok') and after.get('otpAvailable')
            print('PRODUCTION_VISUAL_PUBLISHED_AND_VERIFIED','Worker',version(),'domain',root)
            print('BACKEND_D1_DNS_OTHER_PROJECTS_UNCHANGED')
          except Exception as e:
            print('DEPLOY_OR_POSTCHECK_FAILED',type(e).__name__,str(e)[:400])
            if deployed:rollback()
            raise
          PY
