name: Via GeoV2 - localizar registro de despliegue
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/via-geov2-v26-diagnose.yml
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar registro GitHub Actions del intento V26 sin alterar Cloudflare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          repo=os.environ['REPO'];token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          release_sha='41d1f29c196a1382259a0c5d4c4550019aecea41'
          url=f'https://api.github.com/repos/{repo}/actions/workflows/via-geov2-v26-production.yml/runs?per_page=25'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=22) as resp:
            data=json.load(resp)
          runs=data.get('workflow_runs') or []
          print('FOUND_RUNS',len(runs))
          for r in runs[:10]:
            print('RELEASE_RUN',r['id'],r['head_sha'],r.get('status'),r.get('conclusion'))
          chosen=next((r for r in runs if r['head_sha']==release_sha),None)
          assert chosen,'No se encontró el despliegue inicial para inspeccionar'
          target=f'https://github.com/{repo}/actions/runs/{chosen["id"]}'
          body=json.dumps({'state':'success','context':'via-geov2-v26-run-link',
            'target_url':target,'description':'Enlace al registro de publicación; NO implica éxito'}).encode()
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/statuses/'+release_sha,
              data=body,headers={**headers,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as resp:
            assert resp.status==201
          print('RELEASE_LOG_LINK_READY',target)
          PY
