name: Via GeoV2 V26 - diagnostico HTML sin modificar producción
on:
  push:
    branches: [main]
    paths: ['.github/workflows/via-geov2-v26-diagnose.yml']
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Comparar HTML publicado y Worker QA sin secretos
        run: |
          python3 - <<'PY'
          import urllib.request,re,difflib,hashlib
          LIVE='https://viatraslados.com'
          QA='https://via-traslados-web-geov2-v26-qa.marcelof-gx.workers.dev'
          def grab(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ViaV26ReadOnlyDiff','Accept-Encoding':'identity'}),timeout=25) as r:
              return r.status,r.read().decode('utf-8','replace')
          def noanalytics(s):
            return re.sub(r'<script\b[^>]*static\.cloudflareinsights\.com[^>]*>.*?</script>','',s,flags=re.I|re.S)
          for file in ['conductor.html','reserva.html','mis-reservas.html','app.js','store.js','config.js']:
            astatus,a=grab(LIVE+'/'+file)
            bstatus,b=grab(QA+'/'+file)
            aa=noanalytics(a);bb=noanalytics(b)
            digest=lambda x:hashlib.sha256(x.encode()).hexdigest()[:12]
            print('ASSET',file,'http',astatus,bstatus,'len',len(a),len(b),'raw',digest(a),digest(b),'without_analytics',digest(aa),digest(bb),'same_after_strip',aa==bb,'analytics_script_count',a.count('static.cloudflareinsights.com'),b.count('static.cloudflareinsights.com'))
            if file.endswith('.html') and aa!=bb:
              seq=difflib.SequenceMatcher(None,aa,bb,autojunk=False)
              for tag,i,j,k,l in seq.get_opcodes():
                if tag!='equal':
                  print('DIFF',file,'tag',tag,'live',repr(aa[max(0,i-90):j+90][:420]),'qa',repr(bb[max(0,k-90):l+90][:420]))
                  break
          PY
