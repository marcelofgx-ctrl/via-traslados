name: "Vía V30.2 — QA aislada con rutas reales"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths: [".github/workflows/via-v302-live-route-stage.yml"]
permissions:
  contents: read
concurrency:
  group: via-v302-live-route-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Preparar exactamente V30.2 con puente aislado
        run: |
          python3 scripts/v302-live-route-stage.py
          node --check v302-live-stage/worker.mjs
          npx --yes wrangler@4.160.1 deploy --config v302-live-stage/wrangler.jsonc --dry-run
      - name: Publicar solo QA aislada
        run: npx --yes wrangler@4.160.1 deploy --config v302-live-stage/wrangler.jsonc
      - name: Probar navegador con API de rutas REAL sin reservas
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node scripts/v302-live-route-browser.mjs
      - name: Confirmar WEB y API productivas sin cambios
        run: python3 -c "import runpy;runpy.run_path('scripts/v302-route-cache-qa.py')['baseline']();print('VIA_V302_PRODUCTION_UNCHANGED')"
