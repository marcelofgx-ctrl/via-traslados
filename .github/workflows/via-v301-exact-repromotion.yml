name: "Vía V30.1 — revalidación y promoción exacta"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths: [".github/workflows/via-v301-exact-repromotion.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: via-v30-poi-prod-api-web-atomic
  cancel-in-progress: false
jobs:
  release:
    if: "github.event.head_commit.message == 'release: repromote exact verified V30.1 pair with asset transport retries'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with:
          name: via-v301-production-manifest
          path: v30-poi-prod-build
          run-id: 45466091930
          github-token: ${{ github.token }}
      - name: Validar línea base y candidatos antes de tocar tráfico
        run: |
          npm test
          node --check tests/prod-core-invariants.mjs
          python3 scripts/v301-exact-repromotion.py verify
          node tests/prod-core-invariants.mjs
      - name: Promover API exacta
        id: promote
        run: python3 scripts/v301-exact-repromotion.py api
      - name: Validar API y rutas
        run: node scripts/v301-release-smoke.mjs api
      - name: Promover WEB exacta previamente probada
        run: python3 scripts/v301-exact-repromotion.py web
      - name: Validar buscador y núcleo productivo
        run: |
          node scripts/v301-release-smoke.mjs web
          node tests/prod-core-invariants.mjs
          python3 scripts/v301-exact-repromotion.py final
      - name: Restaurar ambas versiones anteriores si falla una comprobación
        if: failure() && steps.promote.outcome != 'skipped'
        run: node scripts/v30-poi-prod-rollback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-v301-final-manifest
          path: v30-poi-prod-build/manifest.json
          retention-days: 30
          if-no-files-found: ignore
