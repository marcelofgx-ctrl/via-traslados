name: Via Traslados - activar clave privada del conductor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/via-operator-key.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activar huella SHA-256 en secreto, nunca la contraseña en GitHub
        id: setup
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          printf '%s' 'b8db91e34c9d4d777fb642afb505805137a41b4bd7cc7b9339058a80ab24d924' | npx --yes wrangler@4 secret put OPERATOR_KEY_HASH --name via-traslados-api
      - name: Verificar presencia de secreto sin revelar su valor
        id: verify
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --name via-traslados-api --format json > /tmp/via-secret-names.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/via-secret-names.json','utf8'));if(!x.some(a=>a.name==='OPERATOR_KEY_HASH'))process.exit(1);console.log('Clave del operador registrada correctamente')"
          curl -fsS --max-time 20 'https://via-traslados-api.marcelof-gx.workers.dev/api/health' > /tmp/via-health.json
          grep -q '"otpAvailable":true' /tmp/via-health.json
      - name: Guardar estado, sin escribir la contraseña ni su hash
        if: always()
        env:
          SETUP_RESULT: ${{ steps.setup.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          mkdir -p .ci
          {
            echo "Proyecto: via-traslados-api"
            echo "Secreto de conductor: $SETUP_RESULT"
            echo "Comprobación: $VERIFY_RESULT"
            echo "Se conservó la API OTP y el dominio viatraslados.com."
          } > .ci/via-operator-status.txt
          git config user.name "via-traslados-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/via-operator-status.txt
          git commit -m "ci(via-api): estado de acceso privado" || true
          git push origin HEAD:main || true
      - name: Fallar si no se configuró correctamente
        if: steps.setup.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
