name: Vía Traslados — reset transaccional D1 prod con backup verificado
on:
  push:
    branches: [via-v35-reset-audit-perf-20261117]
    paths: [".github/workflows/via-v35-prod-test-reset.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: via-v35-d1-prod-maintenance
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Exigir auditoría y backup restaurable PREVIOS, verificables por GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 44220332530 44220512329; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.conclusion')
            test "$conclusion" = success || { echo "Auditoría o respaldo no terminados correctamente: $id"; exit 1; }
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44220512329/artifacts" \
            --jq '.artifacts[] | select(.id==14390502186 and .name=="VIA_TRASLADOS_D1_PROD_FULL_BACKUP_BEFORE_RESET_PRIVATE" and .expired==false) | .id' | grep -Fx 14390502186
          echo 'PREVIOUS_BACKUP_SUCCESS_AND_PRIVATE_OK'
      - name: Recuperar respaldo SQL real a runner PRIVADO para comparar con producción
        uses: actions/download-artifact@v4
        with:
          name: VIA_TRASLADOS_D1_PROD_FULL_BACKUP_BEFORE_RESET_PRIVATE
          run-id: 44220512329
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/via-backup-for-guard
      - name: Restaurar respaldo previo offline y corroborar 25 reservas, sin escribir D1
        run: |
          set -euo pipefail
          umask 077
          FILE="$RUNNER_TEMP/via-backup-for-guard/via-traslados-prod-before-reset.sql"
          test -s "$FILE"
          sqlite3 "$RUNNER_TEMP/via-before-reset-rehearsal.sqlite" < "$FILE"
          test "$(sqlite3 "$RUNNER_TEMP/via-before-reset-rehearsal.sqlite" 'PRAGMA integrity_check;')" = ok
          test "$(sqlite3 "$RUNNER_TEMP/via-before-reset-rehearsal.sqlite" 'SELECT COUNT(*) FROM bookings;')" -eq 25
          echo 'PRE_RESET_SQL_BACKUP_RESTORED_OFFLINE'
      - name: Detectar D1 exclusiva via-traslados-db; no QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-d1.mjs
      - name: Construir config temporal D1 exclusiva, sin Worker deploy
        env:
          VIA_PUBLIC_ORIGIN: ${{ vars.VIA_PUBLIC_ORIGIN }}
          VIA_RESEND_FROM: ${{ vars.VIA_RESEND_FROM }}
        run: |
          set -euo pipefail
          node scripts/create-wrangler.mjs
          grep -Fx 'database_name = "via-traslados-db"' wrangler.toml
      - name: Comparar FÍSICAMENTE registros del respaldo con producción (si cambian ABORTAR)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIA_BACKUP_DB_PATH: ${{ runner.temp }}/via-before-reset-rehearsal.sqlite
        run: node scripts/v35_prod_reset_guard.mjs
      - name: Ensayar SQL de reset en COPIA LOCAL y validar integridad
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/via-before-reset-rehearsal.sqlite" "$RUNNER_TEMP/via-reset-rehearsal.sqlite"
          sqlite3 "$RUNNER_TEMP/via-reset-rehearsal.sqlite" 'PRAGMA foreign_keys=ON;' < scripts/v35_prod_transactional_reset.sql
          test "$(sqlite3 "$RUNNER_TEMP/via-reset-rehearsal.sqlite" 'PRAGMA integrity_check;')" = ok
          test "$(sqlite3 "$RUNNER_TEMP/via-reset-rehearsal.sqlite" 'PRAGMA foreign_key_check;' | wc -c)" -eq 0
          test "$(sqlite3 "$RUNNER_TEMP/via-reset-rehearsal.sqlite" 'SELECT COUNT(*) FROM bookings;')" -eq 0
          test "$(sqlite3 "$RUNNER_TEMP/via-reset-rehearsal.sqlite" 'SELECT COUNT(*) FROM customers;')" -eq 0
          test "$(sqlite3 "$RUNNER_TEMP/via-reset-rehearsal.sqlite" "SELECT COUNT(*) FROM staff_users WHERE role='admin' AND status='approved';")" -eq 1
          echo 'RESET_REHEARSED_ON_FULL_OFFLINE_COPY: foreign keys and admin safe.'
      - name: Capturar NUEVO bookmark Time Travel inmediatamente antes del reset
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/v35-capture-bookmark.mjs
      - name: Retener punto de recuperación PRIVADO antes de escribir
        uses: actions/upload-artifact@v4
        with:
          name: VIA_D1_PROD_RESET_IMMEDIATE_RECOVERY_BOOKMARK_PRIVATE
          path: ${{ runner.temp }}/via-v35-bookmark.json
          retention-days: 30
          if-no-files-found: error
      - name: Ejecutar limpieza productiva SOLO en via-traslados-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(grep -Ec '^DELETE FROM |^INSERT INTO ' scripts/v35_prod_transactional_reset.sql)" -eq 16
          npx --yes wrangler@4.160.1 d1 execute via-traslados-db --remote --config wrangler.toml --file scripts/v35_prod_transactional_reset.sql
          echo 'PROD_D1_RESET_EXECUTED'
      - name: Auditoría POST-reset: tablas vacías, admin intacto, geo preservado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/v35_prod_reset_verify.mjs
      - name: Validar web V29 y descarga APK V35 sin modificar ambos
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://viatraslados.com/ -o /tmp/via-after-reset.html
          grep -F 'app.js?v=29' /tmp/via-after-reset.html >/dev/null
          grep -F 'via-driver-v35-download' /tmp/via-after-reset.html >/dev/null
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://viatraslados.com/descargas/via-traslados-conductor-v35.apk)" = 200
          echo 'WEB_V29_AND_APK_V35_PRESERVED'
