name: Vía Traslados V28 — descarga pública verificada
on:
  push:
    branches: [via-apk-descarga-qa-20261112]
    paths: [".github/workflows/via-v28-public-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Página de descarga V28 accesible desde Internet sin GitHub
        run: |
          set -euo pipefail
          BASE=https://via-conductor-apk-qa.vercel.app/v28-preview/
          ok=0
          for attempt in $(seq 1 12); do
            status=$(curl -sSL --max-time 15 -o /tmp/v28-index -w '%{http_code}' "$BASE" || true)
            if [ "$status" = 200 ] && grep -q 'Centro de operaciones V28' /tmp/v28-index; then
              ok=1
              break
            fi
            echo "Retry $attempt HTTP $status"
            sleep 4
          done
          test "$ok" -eq 1
          grep -q 'sin usuario ni contraseña' /tmp/v28-index
      - name: APK V28 anónima coincide exactamente con el checksum QA
        run: |
          set -euo pipefail
          BASE=https://via-conductor-apk-qa.vercel.app/v28-preview
          curl -fLsS --retry 4 --max-time 150 "$BASE/via-conductor-v28-demo.apk" -o /tmp/via-v28.apk
          test "$(stat -c%s /tmp/via-v28.apk)" -gt 1000000
          echo "388312fc02eb895418e6aed9de3761ffbe5898ce51ce1a8db9ac4d5d0f057466  /tmp/via-v28.apk" | sha256sum -c -
          unzip -t /tmp/via-v28.apk | tail -2
          file /tmp/via-v28.apk
