name: "Vía V30 — inspección segura de export API activa (sin cambios)"
on:
  push:
    branches: [via-v30-geoapify-places-qa-20261124]
    paths: [".github/workflows/via-v30-poi-api-export-readonly.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Leer firma del módulo ejecutable API y las comprobaciones del wrapper
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];t=os.environ['CLOUDFLARE_API_TOKEN']
          u='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/via-traslados-api'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer '+t})
          with urllib.request.urlopen(req,timeout=25) as r:
            mime=r.headers.get('Content-Type','');raw=r.read()
          b=re.search(r'boundary="?([^";]+)',mime);assert b
          parts=raw.split(b'--'+b.group(1).encode())
          hits=[p.split(b'\r\n\r\n',1)[1].rstrip(b'\r\n').decode('utf8','replace') for p in parts if b'name="worker.js"' in p and b'\r\n\r\n' in p]
          assert len(hits)==1;source=hits[0]
          plain=len(re.findall(r'\bexport\s+default\b',source))
          bundled=re.findall(r'\bexport\s*\{\s*([A-Za-z_$][\w$]*)\s+as\s+default\s*\}\s*;?',source)
          other=re.findall(r'\bexport\s*\{[^}]{0,150}\}',source)
          info={'module_len':len(source),'plain_default_count':plain,'bundled_default_count':len(bundled),'has_health':('/api/health' in source),'has_exact_envDB':('env.DB' in source),'has_other_DB':('.DB.' in source or '.DB)' in source),'has_viaPoiHandle':('viaPoiHandle' in source),'has_active_worker_marker':('__viaActiveApiWorker' in source),'export_block_count':len(other),'export_structural_lengths':[len(x) for x in other[-3:]],'has_dynamic_import':bool(re.search(r'\bimport\s*\(',source)),'starts_with_module_comment':source.lstrip().startswith('//')}
          print('VIA_POI_API_EXPORT_DIAGNOSTIC '+json.dumps(info))
          PY
      - run: echo "READ ONLY - no source printed, no D1, no deploy"
