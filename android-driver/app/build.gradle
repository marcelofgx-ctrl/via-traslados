plugins { id 'com.android.application' }

android {
    namespace 'uy.viatraslados.conductor'
    compileSdk 35
    defaultConfig {
        applicationId project.hasProperty('viaDensePreview') ? 'uy.viatraslados.conductor.v28preview' : (project.hasProperty('viaPreview') ? 'uy.viatraslados.conductor.v27preview' : 'uy.viatraslados.conductor.autoprecalcqa')
        minSdk 26
        targetSdk 35
        versionCode project.hasProperty('viaDensePreview') ? 28 : (project.hasProperty('viaPreview') ? 27 : 10)
        versionName project.hasProperty('viaDensePreview') ? '0.28.0-preview' : (project.hasProperty('viaPreview') ? '0.27.0-preview' : '1.0.0-auto-precalc-qa')
        buildConfigField 'boolean', 'VIA_PREVIEW', (project.hasProperty('viaPreview') || project.hasProperty('viaDensePreview')) ? 'true' : 'false'
        manifestPlaceholders = [appLabel: project.hasProperty('viaDensePreview') ? 'Vía Traslados V28 Demo' : (project.hasProperty('viaPreview') ? 'Vía Traslados V27 Demo' : 'Vía Traslados QA 1.0')]
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
