plugins { id 'com.android.application' }

android {
    namespace 'uy.viatraslados.conductor'
    compileSdk 35
    defaultConfig {
        applicationId 'uy.viatraslados.conductor.qa'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-admin-qa'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
