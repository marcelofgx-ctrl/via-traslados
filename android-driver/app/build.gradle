plugins { id 'com.android.application' }
// V35: variante productiva instalable en paralelo a las APK de QA.
// No activar perfiles QA en una compilación que opera con reservas reales.
def viaProduction = project.hasProperty('viaProduction')
def viaProductionRelease = project.hasProperty('viaProductionRelease')
if (viaProduction && viaProductionRelease) throw new GradleException('Elegí RC o release; no ambas')
def hourlyPreview = project.hasProperty('viaHourlyPreview')
if(hourlyPreview && !project.hasProperty('viaOperationPreview')) throw new GradleException('Hourly preview requires offline operation preview')
def qaVariants = ['viaPreview','viaDensePreview','viaBusinessPreview',
                  'viaLayoutPreview','viaOperationPreview','viaHourlyPreview','viaOnlineQa',
                  'viaOnboardQa','viaCatalogQa']
if ((viaProduction || viaProductionRelease) && qaVariants.any { project.hasProperty(it) }) {
    throw new GradleException('VIA_PRODUCTION no puede combinarse con modos QA o DEMO')
}


android {
    namespace 'uy.viatraslados.conductor'
    compileSdk 35
    defaultConfig {
        applicationId hourlyPreview ? 'uy.viatraslados.conductor.v36hourlypreview' : viaProductionRelease ? 'uy.viatraslados.conductor.production' : (viaProduction ? 'uy.viatraslados.conductor.productionrc' : (project.hasProperty('viaCatalogQa') ? 'uy.viatraslados.conductor.v34catalogqa' : (project.hasProperty('viaOnboardQa') ? 'uy.viatraslados.conductor.v33onboardqa' : (project.hasProperty('viaOnlineQa') ? 'uy.viatraslados.conductor.v32onlineqa' : (project.hasProperty('viaOperationPreview') ? 'uy.viatraslados.conductor.v31preview' : (project.hasProperty('viaLayoutPreview') ? 'uy.viatraslados.conductor.v30preview' : (project.hasProperty('viaBusinessPreview') ? 'uy.viatraslados.conductor.v29preview' : (project.hasProperty('viaDensePreview') ? 'uy.viatraslados.conductor.v28preview' : (project.hasProperty('viaPreview') ? 'uy.viatraslados.conductor.v27preview' : 'uy.viatraslados.conductor.autoprecalcqa')))))))))
        minSdk 26
        targetSdk 35
        versionCode hourlyPreview ? 36 : viaProductionRelease ? 35 : (viaProduction ? 35 : (project.hasProperty('viaCatalogQa') ? 34 : (project.hasProperty('viaOnboardQa') ? 33 : (project.hasProperty('viaOnlineQa') ? 32 : (project.hasProperty('viaOperationPreview') ? 31 : (project.hasProperty('viaLayoutPreview') ? 30 : (project.hasProperty('viaBusinessPreview') ? 29 : (project.hasProperty('viaDensePreview') ? 28 : (project.hasProperty('viaPreview') ? 27 : 10)))))))))
        versionName hourlyPreview ? '0.36.0-hourly-preview' : viaProductionRelease ? '0.35.0' : (viaProduction ? '0.35.0-production-rc2' : (project.hasProperty('viaCatalogQa') ? '0.34.0-catalog-qa' : (project.hasProperty('viaOnboardQa') ? '0.33.0-onboarding-qa' : (project.hasProperty('viaOnlineQa') ? '0.32.0-qa-online' : (project.hasProperty('viaOperationPreview') ? '0.31.0-preview' : (project.hasProperty('viaLayoutPreview') ? '0.30.0-preview' : (project.hasProperty('viaBusinessPreview') ? '0.29.0-preview' : (project.hasProperty('viaDensePreview') ? '0.28.0-preview' : (project.hasProperty('viaPreview') ? '0.27.0-preview' : '1.0.0-auto-precalc-qa')))))))))
        buildConfigField 'boolean', 'VIA_HOURLY_PREVIEW', hourlyPreview ? 'true' : 'false'
        buildConfigField 'boolean', 'VIA_PREVIEW', (project.hasProperty('viaPreview') || project.hasProperty('viaDensePreview') || project.hasProperty('viaBusinessPreview') || project.hasProperty('viaLayoutPreview') || project.hasProperty('viaOperationPreview')) ? 'true' : 'false'
        buildConfigField 'boolean', 'VIA_DENSE_PREVIEW', project.hasProperty('viaDensePreview') ? 'true' : 'false'
        buildConfigField 'boolean', 'VIA_BUSINESS_PREVIEW', (project.hasProperty('viaBusinessPreview') || project.hasProperty('viaLayoutPreview') || project.hasProperty('viaOperationPreview')) ? 'true' : 'false'
        buildConfigField 'boolean', 'VIA_LAYOUT_PREVIEW', project.hasProperty('viaLayoutPreview') ? 'true' : 'false'
        buildConfigField 'boolean', 'VIA_OPERATION_PREVIEW', project.hasProperty('viaOperationPreview') ? 'true' : 'false'
        buildConfigField 'boolean', 'VIA_ONLINE_QA', (project.hasProperty('viaOnlineQa') || project.hasProperty('viaOnboardQa') || project.hasProperty('viaCatalogQa')) ? 'true' : 'false'
        buildConfigField 'boolean', 'VIA_ONBOARD_QA', (project.hasProperty('viaOnboardQa') || project.hasProperty('viaCatalogQa')) ? 'true' : 'false'
        buildConfigField 'boolean', 'VIA_PRODUCTION', (viaProduction || viaProductionRelease) ? 'true' : 'false'
        manifestPlaceholders = [appLabel: hourlyPreview ? 'Vía Traslados V36 Horas QA' : viaProductionRelease ? 'Vía Traslados' : (viaProduction ? 'Vía Traslados · RC V35 (interno)' : (project.hasProperty('viaCatalogQa') ? 'Vía Traslados V34 Catálogo QA' : (project.hasProperty('viaOnboardQa') ? 'Vía Traslados V33 Registro QA' : (project.hasProperty('viaOnlineQa') ? 'Vía Traslados V32 QA Online' : (project.hasProperty('viaOperationPreview') ? 'Vía Traslados V31 Demo' : (project.hasProperty('viaLayoutPreview') ? 'Vía Traslados V30 Demo' : (project.hasProperty('viaBusinessPreview') ? 'Vía Traslados V29 Demo' : (project.hasProperty('viaDensePreview') ? 'Vía Traslados V28 Demo' : (project.hasProperty('viaPreview') ? 'Vía Traslados V27 Demo' : 'Vía Traslados QA 1.0')))))))))]
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
